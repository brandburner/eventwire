<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EventWire — legislation that may affect GOV.UK content</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Libre+Franklin:wght@400;500;600;700&display=swap">
<!--
  EventWire content-readiness board.

  Ported from the Claude Design canvas "EventWire Flow v2.dc.html" (guvnor design
  system) into a single self-contained page the stdlib serve.py can render: no
  external JS/CSS, the DCLogic component reworked as vanilla JS, design-system
  tokens (Noto Sans body / Libre Franklin headings, GOV.UK palette, the .t-* type
  ramp) inlined. Reads outputs/queue.json over fetch() and computes nothing on the
  server. Hash-routed views (see the "hash routing" block): the Worklist (#/) at
  the top level, drilling into Act detail -> Page next-steps.

  One deliberate divergence from the canvas: the runway time-axis is derived from
  the data window (start-by .. commencement across in-window Acts) rather than the
  canvas's hard-coded May–Nov 2026 scale, so the board stays correct as the
  plan-window shifts.
-->
<style>
  :root {
    --font-stack: "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-heading: "Libre Franklin", "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

    --font-size-base: 19px; --font-size-sm: 16px; --font-size-xs: 14px;
    --font-size-2xs: 12px; --font-size-3xs: 13px; --font-size-lead: 21px;
    --font-size-title: 22px; --font-size-2xl: 28px; --font-size-xl: 36px; --font-size-xxl: 48px;

    --leading-heading: 1.1; --leading-snug: 1.2; --leading-title: 1.3; --leading-body: 1.5;
    --tracking-tight: -0.02em; --tracking-snug: -0.01em; --tracking-wider: 0.08em;

    --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px;
    --space-lg: 24px; --space-xl: 32px; --space-2xl: 48px;

    /* Text — every pair verified at 4.5:1 or better on both surface and page. */
    --color-text-primary: #0b0c0c; --color-text-secondary: #505a5f; --color-text-muted: #687074;
    --color-gov-blue: #1d70b8;
    --color-bg-page: #f3f2f1; --color-surface: #ffffff; --color-masthead: #0b1f35;
    --color-masthead-text: #ffffff; --color-masthead-subtle: #c3d3e3; --color-masthead-link: #a8c7e8;
    --color-border: #b1b4b6; --color-border-light: #e1dfdc; --color-rule: #ebe9e6;
    --color-red: #d4351c; --color-red-ink: #942514; --color-red-tint: #fbe5e1;
    --color-green: #00703c; --color-green-ink: #005a30; --color-green-tint: #e4f3ea;
    --color-amber-ink: #6b4700; --color-amber-tint: #fdf2d8;
    --color-blue-ink: #144e81; --color-blue-tint: #e8f1f8;
    --color-neutral-ink: #383f43; --color-neutral-tint: #eceded;
    --color-focus: #ffdd00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-stack); font-size: var(--font-size-base); font-weight: 400;
    line-height: var(--leading-body); color: var(--color-text-primary); background: var(--color-bg-page);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  h1, h2, h3, h4 { font-family: var(--font-heading); color: var(--color-text-primary); margin: 0; }

  /* ---- design-system type ramp (.t-*) ---- */
  .t-overline { font-family: var(--font-stack); font-weight: 600; font-size: var(--font-size-3xs);
    line-height: var(--leading-snug); letter-spacing: var(--tracking-wider); text-transform: uppercase; }
  .t-h2 { font-family: var(--font-heading); font-weight: 600; font-size: var(--font-size-xl);
    line-height: var(--leading-heading); letter-spacing: var(--tracking-tight); }
  .t-h3 { font-family: var(--font-heading); font-weight: 650; font-size: var(--font-size-2xl);
    line-height: var(--leading-snug); letter-spacing: var(--tracking-snug); }
  .t-h4 { font-family: var(--font-heading); font-weight: 650; font-size: var(--font-size-title);
    line-height: var(--leading-snug); letter-spacing: var(--tracking-snug); }
  .t-body { font-family: var(--font-stack); font-weight: 400; font-size: var(--font-size-base); line-height: var(--leading-body); }
  .t-body-sm { font-family: var(--font-stack); font-weight: 400; font-size: var(--font-size-sm); line-height: var(--leading-body); }
  .t-caption { font-family: var(--font-stack); font-weight: 400; font-size: var(--font-size-xs);
    line-height: 1.45; color: var(--color-text-secondary); }
  .t-muted { color: var(--color-text-muted); }
  .t-secondary { color: var(--color-text-secondary); }

  /* ---- form controls ---- */
  input[type=search], select { font-family: var(--font-stack); color: #0b0c0c; }
  a:focus { outline: 3px solid transparent; background: #ffdd00; box-shadow: 0 -2px #ffdd00, 0 4px #0b0c0c; color: #0b0c0c; text-decoration: none; }

  /* ---- hover affordances (inline styles can't carry :hover) ---- */
  .ew-row { transition: background .1s ease; }
  .ew-row:hover { background: #f4f8fb; }
  /* Act rows are links (T-099). The global GDS yellow-fill focus would flood a
     full-width grid row and recolour the status chips inside it, so the rows get
     a ring instead. Class+pseudo outranks the `a:focus` rule above. */
  .ew-row:focus {
    outline: 4px solid #0b0c0c; outline-offset: -2px;
    background: #f4f8fb; box-shadow: none; color: inherit;
  }

  /* ---- collapsed page groups (act detail Monitor bucket) ---- */
  details > summary::-webkit-details-marker { display: none; }
  details:not([open]) .ew-open-only { display: none; }
  details[open] .ew-closed-only { display: none; }
  /* Child-scoped variants for a <details> nested inside another (the act-detail
     "show more" pager inside the Monitor bucket), so an open ancestor's rule
     can't hide the inner summary's label. */
  details:not([open]) > summary .ew-more-open { display: none; }
  details[open] > summary .ew-more-closed { display: none; }
  .ew-btn-green { background: #00703c; color: #fff; border: none; box-shadow: 0 2px 0 #00451f; transition: background .1s ease; }
  .ew-btn-green:hover { background: #005a30; }

  /* ---- filter bar ----
     Labels sit ABOVE their control, not inline beside it. Inline, "Team" and
     "Show" read as part of the sentence the option makes ("Show Needing work"),
     and the eye has to work out which words are the question and which are the
     answer. Stacked, the question is always the small caps line and the answer
     is always the box under it. */
  .ew-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .ew-flabel { font-size: 11px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: #505a5f; }
  .ew-field > input, .ew-field > select {
    font-size: 14px; font-family: var(--font-stack); padding: 8px 10px; min-width: 0;
    /* #b1b4b6 on white is 2.2:1 — under the 3:1 WCAG floor for control
       boundaries, so the box a filter lives in was itself hard to see. */
    border: 1px solid #6f777b; border-radius: 4px; background: #fff; color: #0b0c0c;
  }
  .ew-field > input:focus-visible, .ew-field > select:focus-visible {
    outline: 3px solid #ffdd00; outline-offset: 0; box-shadow: inset 0 0 0 2px #0b0c0c;
  }
  /* Each headline number is a way into the rows it counts, so it is a real
     button: keyboard-reachable, and it says which one is active. */
  .ew-stat { background: none; border: 0; padding: 3px 0; margin: 0; cursor: pointer;
    display: inline-flex; align-items: baseline; gap: 6px; font: inherit; }
  .ew-stat:hover .ew-stat-label { text-decoration: underline; }
  .ew-stat:focus-visible { outline: 3px solid #ffdd00; box-shadow: 0 2px #0b0c0c; }
  .ew-stat[aria-pressed="true"] .ew-stat-label { color: #0b0c0c; font-weight: 600;
    text-decoration: underline; text-underline-offset: 3px; }

  /* ---- view-transition crossfade (ported from the canvas helmet) ---- */
  @keyframes ew-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes ew-out { from { opacity: 1; } to { opacity: 0; } }
  ::view-transition-old(root) { animation: ew-out .16s ease both; }
  ::view-transition-new(root) { animation: ew-in .26s ease both; }

  /* ---- mobile / narrow viewport ---- */
  /* The board was authored at a fixed ~1180px canvas; below ~640px the rigid
     300px 1fr 150px runway grid overflows. Collapse to single-column, drop the
     horizontal timeline (its runwayLabel already carries the same info), stack
     the header, wrap the stats, and full-width the page-card CTA. */
  @media (max-width: 640px) {
    .ew-main { padding-left: 14px !important; padding-right: 14px !important; }
    .ew-header-inner { flex-wrap: wrap !important; gap: 4px 12px !important; padding: 12px 14px !important; }
    .ew-header-meta { text-align: left !important; }
    .ew-filters { gap: 10px !important; }
    .ew-filters > .ew-field { flex: 1 1 100% !important; }
    /* The one-line row needs its own stacking on narrow screens: the title must
       be allowed to wrap rather than ellipsis away to nothing in a 200px cell.
       The three metadata columns fold under the title in reading order. */
    .ew-row { grid-template-columns: 52px minmax(0,1fr) !important; gap: 4px 10px !important; }
    .ew-row .ew-counts { overflow: visible !important; }
    .ew-row > span:nth-child(2) { white-space: normal !important; }
    .ew-row .ew-flags, .ew-row .ew-owner, .ew-row .ew-counts {
      grid-column: 2 !important; text-align: left !important; min-width: 0 !important; }
    .ew-page-card { flex-wrap: wrap !important; }
    .ew-page-cta { order: 3; flex: 1 0 100% !important; margin-top: 8px; }
  }
</style>
</head>
<body>
<div id="ew-app"><div style="max-width:1120px;margin:0 auto;padding:60px 24px;color:#687074">Loading the queue…</div></div>

<script>
(function () {
  "use strict";

  // ============================== helpers ==============================
  const MS = 86400000;
  const MON  = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const MONF = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const iso   = s => new Date(s + "T00:00:00Z");
  const dleft = (a, b) => Math.round((iso(b) - iso(a)) / MS);
  const esc   = s => String(s == null ? "" : s).replace(/[&<>"']/g,
    c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

  // ============================== state ==============================
  let Q = null;
  // The reader is one content team among ~88, and the same one every visit.
  // Remembering the choice is the difference between landing on your five items
  // and re-filtering 86 every time. Fail-open: private browsing or a blocked
  // store just means no memory, never a broken board.
  const TEAM_KEY = "eventwire.team";
  const rememberedTeam = (() => {
    try { return localStorage.getItem(TEAM_KEY) || "all"; } catch (_) { return "all"; }
  })();
  // `owner` filters the worklist and is remembered; `team` (T-103) filters the
  // page list inside one Act's detail view and is deliberately not.
  const state = { view:"overview", actIdx:null, pageIdx:null, q:"",
    owner: rememberedTeam, prio:"review", type:"all", team:"all", ready:false };

  // Primary legislation (Acts) vs secondary (statutory instruments — the
  // regulations and orders made under an Act). Both come into force on a date
  // and both need the same content work, so they share the worklist; the type
  // is a filter because a team often wants one or the other.
  const TYPE_LABEL = { primary: "Act", secondary: "Regulations or order" };
  const kindLabel = a => {
    if (a.legType !== "secondary") return "Act";
    const t = (a.siType || "").toLowerCase();
    return t === "order" ? "Order" : t === "rules" ? "Rules" : t === "regulation" ? "Regulations" : "Regulations or order";
  };
  const root = document.getElementById("ew-app");

  // ============================== view model ==============================
  // Faithful port of the canvas component's renderVals(): turns EW_QUEUE
  // (== queue.json, the planning_queue.py output) into the three view models.
  function computeVM() {
    if (!state.ready || !Q || !Q.items) {
      return { loading:true, isOverview:false, isAct:false, isPage:false,
        header:{ updated:"Loading…" }, overview:null, act:null, page:null };
    }

    // ---- queue metadata ----
    const genAt   = Q.generated_at || "";
    const genDate = genAt ? genAt.slice(0, 10) : new Date().toISOString().slice(0, 10);
    const NOW     = genDate;                  // "now" is the build date, so the board is deterministic

    const fmtMed  = s => { const d = iso(s); const b = d.getUTCDate() + " " + MON[d.getUTCMonth()];
      return d.getUTCFullYear() !== iso(NOW).getUTCFullYear() ? b + " " + d.getUTCFullYear() : b; };
    const fmtFull = s => { const d = iso(s); return d.getUTCDate() + " " + MONF[d.getUTCMonth()] + " " + d.getUTCFullYear(); };
    // Worklist rows sit inside a dated band, so the year is already established
    // and the day is all a row needs. Tabular figures keep the column aligned.
    const fmtDay = s => { const d = iso(s); return d.getUTCDate() + " " + MON[d.getUTCMonth()]; };

    // "Built" dates the discovery run. The file is legitimately rewritten
    // afterwards without a fresh crawl, so show that separately rather than
    // letting the header under-report how current the data is.
    const stampAt = Q.stamped_at || "";
    const stampedLater = stampAt && stampAt.slice(0, 10) !== genDate;
    const headerUpdated = "Built " + fmtFull(genDate) + (genAt ? " · " + genAt.slice(11, 16) + " UTC" : "")
      + (stampedLater ? " · updated " + fmtFull(stampAt.slice(0, 10)) : "");

    // ---- runway scale: fit the data window (divergence from the canvas's
    //      hard-coded May–Nov 2026 axis) so bars never run off-canvas ----
    const monthStart = s => { const d = iso(s); return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1)); };
    const addMonths  = (dt, n) => new Date(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() + n, 1));
    const allDates = [];
    for (const it of Q.items) { if (it.date) allDates.push(it.date); if (it.start_by) allDates.push(it.start_by); }
    allDates.push(NOW);
    allDates.sort();
    const lo = allDates[0] || NOW, hi = allDates[allDates.length - 1] || NOW;
    const scaleA = monthStart(lo);
    let scaleB = addMonths(monthStart(hi), 1);             // first of the month after the last date
    if ((scaleB - scaleA) / MS < 45) scaleB = addMonths(scaleA, 2);   // keep at least a couple of months
    const span   = (scaleB - scaleA) / MS;
    const pct    = s => Math.round((((iso(s) - scaleA) / MS / span) * 100) * 100) / 100;
    const nowPct = Math.round((((iso(NOW) - scaleA) / MS / span) * 100) * 100) / 100;
    const startY = scaleA.getUTCFullYear();
    const axis = [];
    for (let m = scaleA; m < scaleB; m = addMonths(m, 1)) {
      const label = MON[m.getUTCMonth()] + (m.getUTCFullYear() !== startY ? " " + String(m.getUTCFullYear()).slice(2) : "");
      axis.push({ label, leftPct: pct(m.toISOString().slice(0, 10)) });
    }

    // ---- constants aligned with the codebase board ----
    // Status combines TWO axes:
    //  - lead-time (suggested start-by date vs today) — always known from data
    //  - progress (per-page work_state, merged in nightly from configs/work_state.json)
    //    — known ONLY for pages someone has recorded. An absent record is
    //    indistinguishable from "nobody has looked", so the board must never
    //    assert "not started" from it (ISS from T-079).
    // `done`/`inprogress` reflect recorded progress; the start-by keys
    // (overdue/startnow/ontrack) state date facts only. `carried` = commencement
    // has passed without a done record, re-admitted so the rolling window can't
    // hide it — again a record fact ("not marked done"), not a work claim.
    const STAT = {
      overdue:   { label:"Past start-by",         color:"#d4351c", tint:"#fbe3e0", ink:"#942514" },
      startnow:  { label:"Start soon",            color:"#f47738", tint:"#fdeee2", ink:"#9c4915" },
      ontrack:   { label:"Lead time in hand",     color:"#00703c", tint:"#e2efe8", ink:"#00402a" },
      inprogress:{ label:"In progress",           color:"#1d70b8", tint:"#d2e2f1", ink:"#0b3d66" },
      done:      { label:"Done",                  color:"#00703c", tint:"#cce2d8", ink:"#00402a" },
      carried:   { label:"In force — check it's done", color:"#942514", tint:"#f6d4cf", ink:"#5c1710" },
      monitor:   { label:"Monitor only",          color:"#687074", tint:"#edeeef", ink:"#505a5f" },
      // Not a backlog. A statutory instrument is usually made about three weeks
      // before it comes into force, which is less than a content update takes —
      // so it is past its start-by from the moment it exists, and counting it
      // as overdue buries the Acts somebody genuinely could have started.
      shortnotice:{ label:"Short notice",          color:"#a8620a", tint:"#fdf0dc", ink:"#7a4a00" }
    };
    const CONF  = { high:"#00703c", medium:"#f47738", low:"#687074" };
    const CONFL = { high:"High confidence", medium:"Medium confidence", low:"Low confidence" };
    const EST_COLORS = { mainstream:"#1d70b8", whitehall:"#7C3AED", specialist:"#0d9488", other:"#687074" };
    const EST_TINTS  = { mainstream:"rgba(29,112,184,.12)", whitehall:"rgba(124,58,237,.12)", specialist:"rgba(13,148,136,.12)", other:"rgba(111,119,123,.12)" };
    const EST_LABELS = { mainstream:"Mainstream", whitehall:"Whitehall", specialist:"Specialist", other:"Other" };
    const OWN_COLORS = { gds:"#1d70b8", dept:"#7C3AED", specialist:"#0d9488", other:"#687074" };
    const OWN_TINTS  = { gds:"rgba(29,112,184,.12)", dept:"rgba(124,58,237,.12)", specialist:"rgba(13,148,136,.12)", other:"rgba(111,119,123,.12)" };
    const WORK = { content_update:"Content update", new_guidance:"New guidance", publication:"Publication" };
    // Per-page progress badge (only shown once someone has recorded something).
    const WSTAT = {
      in_progress:{ label:"In progress", tint:"#d2e2f1", ink:"#0b3d66" },
      done:       { label:"Done",        tint:"#cce2d8", ink:"#00402a" },
      not_doing:  { label:"Not doing",   tint:"#edeeef", ink:"#505a5f" }
    };
    // Old-vs-new value diff (Phase 1, value_diff.py) → a per-page badge and the
    // per-target status label in a snippet proposal. contradicts = page states a
    // superseded value (red flag); stale_date = cites a superseded date; consistent
    // = already states the new value (reassuring). not_asserted/unknown carry no
    // signal and are never attached, so they need no colour.
    const VD = {
      contradicts:{ tint:"#fbe3e0", ink:"#942514" },
      stale_date: { tint:"#fdeee2", ink:"#9c4915" },
      consistent: { tint:"#e2efe8", ink:"#00402a" }
    };
    const vdBadge = vd => {
      if (!vd || !VD[vd.status]) return null;
      const v = VD[vd.status];
      let label;
      if (vd.status === "contradicts") {
        // A discrete value ("£109.40", "6 weeks") reads well inside the uppercase
        // status chip; a sentence-length assertion does not (ISS-030 follow-up —
        // the same "don't chip a clause" fix, now on the per-page badge). Collapse
        // a long value to a short status and let the readable detail note below
        // carry the full "the page says … / the law says …" text.
        const val = (vd.page_value || "").trim();
        label = (val && val.length <= 40)
          ? (vd.matched_old_value ? "Still says " : "Says ") + val
          : "Value may be outdated";
      }
      else if (vd.status === "stale_date") label = "Cites an older date";
      else label = "Already current";
      return { label, tint:v.tint, ink:v.ink };
    };
    const vdTargetLabel = t => {
      if (t.status === "contradicts") return (t.matched_old_value ? "still says " : "says ") + "“" + (t.page_value || "something different") + "”";
      if (t.status === "stale_date") return "cites an older date";
      if (t.status === "consistent") return "already up to date";
      return t.status || "";
    };

    const shortOwner = o => {
      if (!o) return "—";
      if (/^GDS/.test(o)) { const m = o.match(/policy:\s*([^)]+)/); return "GDS GOV.UK" + (m ? " · " + m[1].trim() : ""); }
      return o.replace(/ content team$/, "");
    };
    const ownerClassOf = o => {
      if (/^GDS/.test(o)) return "gds";
      if (/specialist publisher/.test(o)) return "specialist";
      if (/content team$/.test(o)) return "dept";
      return "other";
    };
    const ownerColorOf = o => OWN_COLORS[ownerClassOf(o)];
    const ownerTintOf = o => OWN_TINTS[ownerClassOf(o)];
    const deptOf = o => {
      if (!o) return "the team";
      if (/^GDS/.test(o)) { const m = o.match(/policy:\s*([^)]+)/); return m ? m[1].trim() : "policy"; }
      return o.replace(/ content team$/, "");
    };
    const statusOf = sb => { if (!sb) return "monitor"; const d = dleft(NOW, sb); return d < 0 ? "overdue" : (d <= 14 ? "startnow" : "ontrack"); };

    // Progress axis over an Act's ACTIONABLE pages (action/review; monitor pages
    // need no work). "none" => nothing to produce; else done / in_progress /
    // not_started. `not_doing` counts as settled (deliberately out of scope).
    const actionable = it => (it.affected_pages || []).filter(p => p.priority === "action" || p.priority === "review");
    const progressOf = it => {
      const work = actionable(it);
      if (!work.length) return "none";
      const states = work.map(p => p.work_state || "not_started");
      const outstanding = states.filter(s => s !== "done" && s !== "not_doing");
      if (!outstanding.length) return "done";
      if (states.some(s => s === "in_progress" || s === "done")) return "in_progress";
      return "not_started";
    };
    // Combined display key: progress wins where it's known; otherwise fall back to
    // the lead-time (start-by) key. Reaching overdue/startnow/ontrack means no
    // recorded progress — which is NOT the same as "not started", so those
    // labels and their banner lines speak only about dates and records.
    // Was there ever enough runway? An instrument's notice period is
    // commencement − made. If that was already shorter than the content work
    // needs, the start-by could not have been met by anyone, so "past start-by"
    // describes the legislative timetable rather than this team's performance.
    const noticeDays = it => {
      if (!it.made_date || !it.date) return null;
      return dleft(it.made_date, it.date);
    };
    const bornShort = it => {
      const n = noticeDays(it);
      return n !== null && it.lead_time && n < it.lead_time.days;
    };
    const displayStatusOf = (it, dstatus) => {
      if (it.carried_over) return "carried";
      const prog = progressOf(it);
      if (prog === "done") return "done";
      if (prog === "in_progress") return "inprogress";
      // An instrument that never had the runway is short-notice, not overdue.
      // One that WAS made in good time and is still untouched stays overdue —
      // that is a real backlog and must not be excused.
      if (dstatus === "overdue" && bornShort(it)) return "shortnotice";
      return dstatus;   // "none" (monitor-only) or "not_started" -> lead-time key
    };
    const outstandingCount = it => actionable(it).filter(p => (p.work_state || "not_started") !== "done" && (p.work_state || "not_started") !== "not_doing").length;

    // ---- build one act model per queue item ----
    // Dated work and prospective work are separate queue lanes because only
    // the former has deadlines. On an Act page, join them by Act URL so the
    // user can see the full set of matched measures without changing the
    // worklist's counts or urgency.
    const prospectiveByUrl = new Map(((Q.prospective && Q.prospective.items) || [])
      .filter(x => x.legislation_url)
      .map(x => [x.legislation_url, x]));
    const acts = Q.items.map((it, idx) => {
      // Copy written for Acts reads wrong on an instrument: "the Act itself",
      // "Primary commencement" (on a piece of secondary legislation), and
      // "Act-level match" all mislead.
      const isSecondary = it.legislation_type === "secondary";
      const prospectiveMatch = prospectiveByUrl.get(it.legislation_url);
      const datedUrls = new Set((it.affected_pages || []).map(p => p.url).filter(Boolean));
      const longerTermPages = prospectiveMatch
        ? (prospectiveMatch.affected_pages || [])
            .filter(p => p.url && !datedUrls.has(p.url))
            .map(p => Object.assign({}, p, {
              priority: "monitor",
              long_term: true,
              long_term_provisions: prospectiveMatch.provisions_sample || []
            }))
        : [];
      const affectedPages = (it.affected_pages || []).concat(longerTermPages);
      const D = it.date;
      const S = it.start_by;          // commencement − lead_time.days (or null = monitor only)
      const lt = it.lead_time;
      const hasStart = !!S;
      const dstatus = statusOf(S);          // lead-time axis (drives runway geometry)
      const status = displayStatusOf(it, dstatus);   // combined key for the chip/banner
      const st = STAT[status];
      const dts = hasStart ? dleft(NOW, S) : null;
      const outN = outstandingCount(it);

      let urgency, bannerLine;
      if (status === "carried")       { const past = dleft(NOW, D); urgency = outN + " page" + (outN === 1 ? "" : "s") + " open"; bannerLine = "In force since " + fmtFull(D) + " — " + Math.abs(past) + " days ago — and " + outN + " matched page" + (outN === 1 ? " is" : "s are") + " still listed here. If they are already updated there is nothing to do: this board follows the law, not your team's work."; }
      else if (status === "done")     { urgency = "done"; bannerLine = "Every page needing work here has been reported done. Comes into force " + fmtFull(D) + "."; }
      else if (status === "inprogress") { urgency = outN + " page" + (outN === 1 ? "" : "s") + " left"; bannerLine = "Reported as in progress — " + outN + " page" + (outN === 1 ? "" : "s") + " still open" + (hasStart ? " (suggested start was " + fmtFull(S) + ")" : "") + "."; }
      else if (status === "overdue")  { urgency = Math.abs(dts) + " days past start-by"; bannerLine = "The suggested start date was " + Math.abs(dts) + " days ago (" + fmtFull(S) + "). If this is not already in hand, treat it as urgent."; }
      else if (status === "shortnotice") {
        const nd = noticeDays(it);
        urgency = nd + " days' notice";
        bannerLine = "Made " + fmtFull(it.made_date) + " and in force " + fmtFull(D)
          + " — " + nd + " days' notice, less than a " + (WORK[(lt || {}).category] || "content update").toLowerCase()
          + " usually takes. Nobody could have started this sooner, so treat it as new work rather than late work.";
      }
      else if (status === "startnow") { urgency = "start within " + dts + " days"; bannerLine = "The suggested start date is about " + dts + " days away (" + fmtFull(S) + ")."; }
      else if (status === "ontrack")  { urgency = dts + " days of lead time"; bannerLine = "Time in hand — suggested start " + fmtFull(S) + " (" + dts + " days away)."; }
      else { urgency = "monitor only"; bannerLine = "Nothing to update yet. Check these pages still read true once the provisions are in force."; }

      const wk = lt ? (lt.weeks_min === lt.weeks_max ? lt.weeks_max + " weeks" : lt.weeks_min + "–" + lt.weeks_max + " weeks") : null;
      const workLabel = lt ? (WORK[lt.category] || lt.category).toLowerCase() : null;
      const leadLine = hasStart ? ("Best started by " + fmtFull(S) + " — a " + workLabel + " usually takes about " + wk) : ("Comes into force " + fmtFull(D));

      // Split rather than one joined string: "6 to update" is work somebody has
      // to do and "1 to review" is a page somebody has to look at, and the row
      // should not weight them the same. The worklist renders the first in full
      // ink and the second muted; everything else still wants the joined form.
      const updateText = it.action_count ? it.action_count + " to update" : "";
      let reviewText = it.review_count ? it.review_count + " to review" : "";
      if (!it.action_count && !it.review_count && it.monitor_count) reviewText = it.monitor_count + " to monitor";
      const countsText = [updateText, reviewText].filter(Boolean).join(" · ");

      // The TEAM axis is who would fix the page now — not who published it.
      // `content_team` resolves a closed publisher to its successor (Highways
      // England -> National Highways) and is free of the content estate, which
      // otherwise split one team three ways ("HMRC content team" / "HMRC
      // (specialist publisher)" / "HMRC"). Falls back through the estate-free
      // publisher to the raw owner for data predating either.
      const teamOf = p => p.content_team || p.owner_org || p.owner;
      const ownersSrc = [...new Set((it.affected_pages || []).map(teamOf))].filter(Boolean);
      const deptsSrc = [...new Set((it.affected_pages || []).map(p => p.department))].filter(Boolean);
      const ownerLine = ownersSrc.length ? (ownersSrc[0] + (ownersSrc.length > 1 ? "  +" + (ownersSrc.length - 1) : "")) : "—";
      // Pages whose publisher no longer exists and was split several ways, so no
      // successor is right for all of them. Shown, not silently routed.
      const needsRouting = (it.affected_pages || []).filter(p => p.needs_routing).length;
      const runwayLabel = hasStart ? ("Start by " + fmtMed(S) + " · " + urgency) : ("In force " + fmtMed(D) + " · monitor only");

      // runway geometry
      const commencePct = pct(D);
      const startPct = hasStart ? pct(S) : null;
      let showOverdueSeg = false, segOverdueLeft = 0, segOverdueWidth = 0, showRunwaySeg = false, segRunwayLeft = 0, segRunwayWidth = 0;
      if (hasStart) {
        // Red "behind" segment only when genuinely behind (not started / not done
        // past start-by). A done or in-progress item past its start-by shows a
        // solid runway in its status colour, not a red bar.
        if (dstatus === "overdue" && (status === "overdue" || status === "carried")) {
          showOverdueSeg = true; segOverdueLeft = startPct; segOverdueWidth = Math.max(0, Math.min(nowPct, commencePct) - startPct);
          segRunwayLeft = Math.max(startPct, nowPct); segRunwayWidth = Math.max(0, commencePct - segRunwayLeft); showRunwaySeg = segRunwayWidth > 0.4;
        } else { showRunwaySeg = true; segRunwayLeft = startPct; segRunwayWidth = Math.max(0, commencePct - startPct); }
      }

      // commencements, grouped by date
      const tidyQual = q => {
        if (!q) return "";
        const m = String(q).toLowerCase();
        if (m.includes("wholly")) return "fully in force";
        if (m.includes("not already")) return "remainder in force";
        if (m.includes("specified")) return "in force for specified purposes";
        if (m === "other") return "subject to qualifications";
        return q;
      };
      // Split a provision ref into its scannable section token and the noisy
      // subsection enumeration: "s. 23(1)(2)(6)(8)(11)(b)(c)(12)-(15)" ->
      // {main:"s. 23", detail:"(1)(2)(6)(8)(11)(b)(c)(12)-(15)"}. The section is
      // shown prominently, the enumeration de-emphasised (full ref on hover).
      const splitRef = r => {
        const m = /^(s{1,2}\.\s*\d+[A-Z]?|sch\w*\.?\s*(?:(?:\d+\s*(?:(?:para|pt)\.?\s*\d+)?)|(?:para\.?\s*\d+)))\s*(.*)$/i.exec(String(r || ""));
        return m ? { main: m[1].replace(/\s+/g, " ").trim(), detail: m[2].trim() } : { main: String(r || "—"), detail: "" };
      };
      const byDate = new Map();
      for (const c of (it.commencements || [])) { if (!byDate.has(c.date)) byDate.set(c.date, []); byDate.get(c.date).push(c); }
      const commencements = [...byDate.keys()].sort().map(d => {
        const list = byDate.get(d);
        const isPrimary = d === D;
        const provisions = list.map(c => {
          const rf = c.provisions || "—";
          const sp = splitRef(rf);
          const isSelfCommencement = c.affecting === "self";
          const sourceUrl = isSelfCommencement ? it.legislation_url : (c.affecting || null);
          return {
          ref: rf, refMain: sp.main, refDetail: sp.detail, refFull: rf,
          // An instrument appoints its own in-force date for itself as a whole —
          // legislation.gov.uk states no per-regulation breakdown, and there is
          // none to state. Saying "provision details not supplied" implies
          // something is missing; nothing is.
          subject: c.description || c.subject
            || (isSecondary ? "The whole instrument comes into force"
                : /^sch/i.test(rf) ? "Schedule amendment" : "Provision details not supplied"),
          qual: tidyQual(c.qualification),
          sourceUrl,
          sourceLead: isSelfCommencement ? "commenced by " : "brought in by ",
          sourceLabel: isSelfCommencement
            ? (isSecondary ? "the regulations themselves" : "the Act itself")
            : (c.affecting ? c.affecting.replace("https://www.legislation.gov.uk/", "").replace(/\/$/, "").toUpperCase() : null)
        };
        });
        // "Primary" here means the earliest date, not primary legislation — on a
        // secondary item those two readings collide, so name the thing itself.
        return { date:d, dateFull:fmtFull(d), color:isPrimary ? st.color : "#687074",
          tagLabel: isPrimary
            ? (isSecondary ? "Comes into force" : "Primary commencement")
            : "Staged commencement",
          countLabel: isSecondary && list.length === 1 && !list[0].provisions
            ? "whole instrument"
            : list.length + " provision" + (list.length > 1 ? "s" : ""),
          provisions };
      });

      // Does the commencement section carry anything the header cannot?
      //
      // An instrument appoints one in-force date for itself as a whole:
      // legislation.gov.uk publishes no per-regulation breakdown because there
      // is none. All 74 instruments in the live window are exactly this. So the
      // section renders a bordered panel, a header row, and a provision row —
      // roughly 230px — to say one date, three times over ("1 September 2026 ·
      // COMES INTO FORCE · whole instrument", then "The whole instrument comes
      // into force", then a link back to the document the header already links).
      //
      // Keyed on the DATA, not on `legislation_type`: an instrument may stage
      // its own commencement across several dates (parse_secondary_metadata
      // returns every ukm:ComingIntoForce), and an Act can just as well commence
      // in one go. Either way the test is the same — one date, one entry, no
      // provisions named, nothing qualified — and the full table returns the
      // moment there is more than that to show.
      const singleWholeCommencement =
        commencements.length === 1
        && commencements[0].provisions.length === 1
        && !(it.commencements || [])[0].provisions
        && !(it.commencements || [])[0].qualification
        && !(it.commencements || [])[0].description
        && !(it.commencements || [])[0].subject;
      const wholeCommencementLine = singleWholeCommencement
        ? {
            dateFull: commencements[0].dateFull,
            color: commencements[0].color,
            what: isSecondary ? "the whole instrument" : "the whole Act",
          }
        : null;

      // subject index for provision matching (topics ↔ commencement subjects)
      const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
      const subjIndex = (it.commencements || []).map(c => ({ key:norm(c.subject), ref:c.provisions || "—", subject:c.subject || "" }));

      const stepDefs = {
        content_update: [
          { l:"Work out which parts of the page actually change", f:0 },
          { l:"Draft the changes", f:0.35 },
          { l:"Check your wording against LAWREF", f:0.6 },
          { l:"Get a second pair of eyes on it (2i)", f:0.78 },
          { l:"Square it off with DEPT policy", f:0.9 },
          { l:"Schedule it to go live before the law does", f:1.0 }
        ],
        new_guidance: [
          { l:"Agree what the new guidance needs to cover", f:0 },
          { l:"Draft it", f:0.4 },
          { l:"Check it against LAWREF", f:0.62 },
          { l:"Get a second pair of eyes on it (2i)", f:0.8 },
          { l:"Square it off with DEPT policy", f:0.92 },
          { l:"Publish it before the law goes live", f:1.0 }
        ],
        publication: [
          { l:"Check the record still reflects what LAWREF changes", f:0 },
          { l:"Make any light touches and publish", f:1.0 }
        ]
      };

      const pages = affectedPages.map((p, pi) => {
        const cat = lt ? lt.category : "content_update";
        const isLongTerm = !!p.long_term;
        // Prefer the pipeline's authoritative page->provision provenance
        // (queue.json `matched_provisions`, from planning_queue.py); fall back to
        // the client-side topic<->subject heuristic only for pre-grounding caches.
        let matchedProvisions;
        if (Array.isArray(p.matched_provisions) && p.matched_provisions.length) {
          matchedProvisions = p.matched_provisions.map(x => ({ ref: x.ref || "—", subject: x.subject || "" }));
        } else {
          const topicKeys = (p.topics || []).map(norm).filter(Boolean);
          const matchMap = new Map();
          for (const si of subjIndex) {
            if (!si.key) continue;
            if (topicKeys.some(tk => tk === si.key || tk.includes(si.key) || si.key.includes(tk))) {
              if (!matchMap.has(si.ref)) matchMap.set(si.ref, si.subject);
            }
          }
          matchedProvisions = [...matchMap.entries()].map(([ref, subject]) => ({ ref, subject }));
        }
        const isProvisionMatch = matchedProvisions.length > 0;
        // Section-level, de-duplicated for the "Brought in by …" chip / why-line
        // (the full subsection detail lives in the commencement block above).
        const matchRefsText = [...new Set(matchedProvisions.map(m => splitRef(m.ref).main))].join(", ");

        let steps;
        if (p.priority === "monitor" || !hasStart) {
          steps = [{ label:"Once the provisions are live, check the page still reads true", f:1.0 }];
        } else {
          // An instrument has no commencement order — it appoints its own date — so
          // "check it against the Act and the commencement order" sends the reader
          // looking for a document that does not exist, on 74 of 87 items.
          const lawRef = isSecondary ? "these regulations" : "the Act and the commencement order";
          steps = (stepDefs[cat] || stepDefs.content_update)
            .map(s => ({ label:s.l.replace("DEPT", deptOf(p.owner)).replace("LAWREF", lawRef), f:s.f }));
        }
        const pageHasStart = hasStart && !isLongTerm;
        const baseS = pageHasStart ? iso(S).getTime() : iso(D).getTime();
        const baseD = iso(D).getTime();
        const stepsOut = steps.map((s, si) => {
          const t = new Date(baseS + s.f * (baseD - baseS));
          const tIso = t.toISOString().slice(0, 10);
          const dd = dleft(NOW, tIso);
          let flag, tint, ink, dotColor;
          if (dd < 0)       { flag="Date passed"; tint=STAT.overdue.tint;  ink=STAT.overdue.ink;  dotColor="#d4351c"; }
          else if (dd <= 14){ flag="Due soon";    tint=STAT.startnow.tint; ink=STAT.startnow.ink; dotColor="#f47738"; }
          else              { flag="Scheduled";   tint="#edeeef";          ink="#505a5f";         dotColor="#b1b4b6"; }
          return { num:si + 1, label:s.label, dateLabel:fmtMed(tIso), flag, tint, ink, dotColor };
        });

        const confWord = p.confidence || "";
        let whyLine;
        if (isLongTerm) {
          whyLine = "May be affected by provisions that are not yet in force. Check the Act again when commencement dates are set.";
        } else if (isProvisionMatch) {
          const subs = matchedProvisions.map(m => m.subject).filter(Boolean).slice(0, 2);
          whyLine = "May need checking against " + matchRefsText + (subs.length ? " — " + subs.join("; ") + "." : ".");
        } else {
          whyLine = isSecondary
            // An instrument commences whole, so matching it whole is the only
            // granularity available — not a weaker result, as it is for an Act
            // where it means the commencing provisions could not be pinned down.
            ? "May need checking against these regulations as a whole."
            : "May need checking against this Act. Check it against the commencement as a whole.";
        }
        const matchLabel = isProvisionMatch
          ? ("Brought in by " + matchRefsText)
          : (isSecondary ? "Whole-instrument match" : "Act-level match");
        const matchTint  = isProvisionMatch ? "#e2efe8" : "#f3f2f1";
        const matchInk   = isProvisionMatch ? "#00402a" : "#505a5f";

        let doNextHead, doNextSub;
        const firstOverdue = stepsOut.find(s => s.flag === "Date passed");
        const firstJob = stepsOut[0].label.charAt(0).toLowerCase() + stepsOut[0].label.slice(1);
        if (isLongTerm) { doNextHead = "Keep it in view"; doNextSub = "No commencement date yet. Check again when dates are set for these provisions."; }
        else if (p.priority === "monitor" || !hasStart) { doNextHead = "Just keep an eye on it"; doNextSub = "Nothing to change yet. Look in again once the provisions go live on " + fmtFull(D) + "."; }
        else if (firstOverdue) { doNextHead = "Worth starting now"; doNextSub = "If it is not already in hand, start with: " + firstJob + ". The suggested start date was " + fmtFull(S) + "."; }
        else { doNextHead = "Not urgent yet"; doNextSub = "Worth getting on the list. Aim to start around " + fmtFull(S) + ". First job: " + firstJob + "."; }

        return {
          pi, idx, url:p.url, title:p.title, description:p.description || "", priority:p.priority, confidence:p.confidence,
          confColor:CONF[p.confidence] || "#687074", confLabel:CONFL[p.confidence] || "",
          estateLabel:EST_LABELS[p.estate] || "Other", estateColor:EST_COLORS[p.estate] || EST_COLORS.other, estateTint:EST_TINTS[p.estate] || EST_TINTS.other,
          docType:(p.doc_type || "page").replace(/_/g, " "),
          publisher:p.publisher_short || "—", ownerShort:shortOwner(p.owner),
          // Estate-free team identity, shared with the worklist filter.
          contentTeam:p.content_team || "", ownerOrg:p.owner_org || "",
          ownerColor:ownerColorOf(p.owner), ownerTint:ownerTintOf(p.owner),
          // Show the publisher chip only when it isn't already the owner (whitehall/
          // specialist pages publish and route to the same org — that was the dupe).
          showPublisher: !!p.publisher_short && p.publisher_short !== shortOwner(p.owner),
          // A button that opens a page of explanation, labelled as though it queued
          // up a task. Nothing here plans anything, and "Plan update" told a reader
          // to do something the board cannot help them do. It navigates — so it says
          // where it goes.
          cta: "What to check",
          workState: p.work_state || "not_started", workBadge: WSTAT[p.work_state] || null, workOwner: p.work_owner || "",
          valueBadge: vdBadge(p.value_diff), valueDiff: p.value_diff || null,
          // Per-page handoff inputs (T-072): raw fields the panel derives
          // stakeholder candidates + reviewing checks from, client-side.
          provisions: matchedProvisions, tier: p.tier || "",
          publisherFull: (p.publisher && p.publisher.title) || "", estate: p.estate || "",
          ownerFull: p.owner || "", ownerOrg: p.owner_org || p.owner || "", rawDocType: p.doc_type || "",
          teamName: p.content_team || p.owner_org || p.owner || "", department: p.department || "",
          needsRouting: !!p.needs_routing,
          reviewDue: p.review_due || [],
          matchLabel, matchTint, matchInk, isProvisionMatch, isLongTerm,
          steps:stepsOut, whyLine, doNextHead, doNextSub,
          workType: pageHasStart ? (WORK[lt.category] || "Content update") : "Monitor",
          startByFull: pageHasStart ? fmtFull(S) : "—", commenceFull: isLongTerm ? "No date yet" : fmtFull(D),
          statusColor: st.color, statusInk: st.ink, actTitle: it.legislation_title, actUrl: it.legislation_url,
          // "View the Act" is wrong for an instrument — name what it actually opens.
          actKind: it.legislation_type === "secondary" ? "regulations" : "Act",
          actHref: "#/act/" + actSlug(it)
        };
      });

      // Report only undated measures that led to a matched GOV.UK page. New
      // payloads carry exact page->provision provenance; older queue files fall
      // back to the matched provision headings already stored as page topics.
      // Grouping here turns the former 40-reference dump into a small, useful
      // measure -> page report while the full prospective count stays visible.
      const futureMeasureMap = new Map();
      for (const p of ((prospectiveMatch && prospectiveMatch.affected_pages) || [])) {
        const exact = Array.isArray(p.matched_provisions) ? p.matched_provisions : [];
        const candidates = exact.length
          ? exact.map(m => ({ ref:m.ref || "", subject:m.subject || "" }))
          : (p.topics || []).map(subject => ({ ref:"", subject }));
        for (const m of candidates) {
          if (!m.ref && !m.subject) continue;
          const key = m.ref || ("subject:" + norm(m.subject));
          if (!futureMeasureMap.has(key)) {
            const sp = m.ref ? splitRef(m.ref) : { main:"", detail:"" };
            futureMeasureMap.set(key, {
              ref:m.ref, refMain:sp.main, refDetail:sp.detail,
              subject:m.subject || "Measure awaiting commencement", pages:new Map()
            });
          }
          const rec = futureMeasureMap.get(key);
          if (p.url && !rec.pages.has(p.url)) rec.pages.set(p.url, p.title || p.url);
        }
      }
      const futureMeasures = [...futureMeasureMap.values()].map(m => ({
        ref:m.ref, refMain:m.refMain, refDetail:m.refDetail, subject:m.subject,
        pages:[...m.pages.entries()].map(([url, title]) => ({ url, title }))
      })).sort((a, b) => b.pages.length - a.pages.length || a.subject.localeCompare(b.subject));

      // "What changes" facts (component_drafter proposals, opt-in via
      // --value-diff): each is one concrete value the Act changes — quality-
      // gated upstream to short entities and checkable values — plus the pages
      // whose value_diff says they still state the superseded value. The
      // drafted callout markdown rides along only as a copy affordance; the
      // board renders, never publishes (T-076).
      const proposals = (it.proposals || []).map(pr => {
        const c = pr.component || {}, src = c.source || {}, r = c.renderings || {};
        return {
          entity:c.affected_entity || "", oldVal:c.old_value || "", newVal:c.new_value || "",
          inForce:c.in_force_date || "", provision:src.provision_ref || "", legisTitle:src.legislation_title || "",
          callout:r.callout || "", tableRow:r.table_row || null,
          needs:pr.needs_count | 0, already:pr.already_count | 0, pageCount:pr.page_count | 0,
          targets:(pr.targets || []).map(t => {
            const b = VD[t.status] || { tint:"#edeeef", ink:"#505a5f" };
            return { url:t.url || "", title:t.title || t.url || "", status:t.status || "", statusLabel:vdTargetLabel(t),
              tint:b.tint, ink:b.ink, pageValue:t.page_value || "", owner:t.owner || "" };
          })
        };
      });

      // The same redundancy one level down from the commencement block. "How was
      // this page matched?" is an item-level fact here, not a page-level one: no
      // instrument names provisions, so all 931 instrument pages in the live
      // window carry an identical "Whole-instrument match" chip, and within
      // every Act the answer is uniform too (11/11 items). A label that reads
      // the same on every row it appears on distinguishes nothing — it states
      // the item's own property once per page. Said once, above the list; the
      // per-page chip returns the moment a list is genuinely mixed.
      const matchLabels = new Set(pages.filter(p => !p.isLongTerm).map(p => p.matchLabel));
      const uniformMatchLabel = matchLabels.size === 1 ? [...matchLabels][0] : "";

      const groupsDef = [
        { key:"action",  label:"To update", hint:"", st:STAT.ontrack },
        { key:"review",  label:"To review", hint:"", st:STAT.startnow },
        { key:"monitor", label:"Monitor",   hint:"probably fine as-is — check once the change is in force", st:STAT.monitor }
      ];
      const groups = groupsDef.map(gd => {
        const items = pages.filter(p => p.priority === gd.key);
        return { key:gd.key, label:gd.label, hint:gd.hint, count:items.length + " page" + (items.length === 1 ? "" : "s"), color:gd.st.color, tint:gd.st.tint, ink:gd.st.ink, items, has:items.length > 0 };
      }).filter(g => g.has);

      return {
        idx, title:it.legislation_title, url:it.legislation_url, commence:D, startBy:S, hasStart,
        dayLabel: fmtDay(D),
        // Every instrument is titled "The … Regulations 2026". On a list where
        // the definite article opens all 73 of them it is four characters of
        // pure noise at the exact point the eye starts reading, and the titles
        // are long enough to be truncated at the other end. Dropped on the
        // worklist row only — everywhere the title is the subject rather than an
        // index entry, it keeps its proper name.
        rowTitle: String(it.legislation_title || "").replace(/^The\s+/, ""),
        legType: it.legislation_type === "secondary" ? "secondary" : "primary",
        siType: it.si_type || "",
        kindShort: (it.si_type || "").toLowerCase() === "order" ? "Order"
          : (it.si_type || "").toLowerCase() === "rules" ? "Rules" : "Regs",
        statusKey: status,
        madeDate: it.made_date || "",
        enablingActs: it.enabling_acts || [],
        // Real route href so the row can be an <a>: keyboard, Enter, middle-click
        // and "open in new tab" all come free from the platform (T-099).
        href: "#/act/" + actSlug(it),
        status, statusLabel:st.label, statusColor:st.color, statusTint:st.tint, statusInk:st.ink,
        wholeCommencementLine, uniformMatchLabel,
        urgency, bannerLine, leadLine, runwayLabel, countsText, updateText, reviewText,
        ownerLine, ownersSrc, deptsSrc, needsRouting,
        action:it.action_count, review:it.review_count, monitor:it.monitor_count, pageCount:pages.length,
        outstanding:outN,   // actionable pages still open (T-098 grouping)
        commencePct, startPct, showOverdueSeg, segOverdueLeft, segOverdueWidth, showRunwaySeg, segRunwayLeft, segRunwayWidth,
        commencements, pages, groups, proposals,
        futureMeasures,
        futureProvisionCount: prospectiveMatch ? (prospectiveMatch.provision_count || 0) : 0,
        futurePageCount: prospectiveMatch ? (prospectiveMatch.page_count || 0) : 0
      };
    });

    // ---- filters (worklist rows only — the act drill-in shows everything) ----
    const prioFilter = state.prio;

    // ---- overview stats ----
    // Overdue and short-notice are counted apart on purpose. Rolled together,
    // the headline was 37 — of which 33 were instruments made weeks after the
    // work would have had to start. One number cannot mean both "we are behind"
    // and "the law gave no notice", and the first is the one to act on.
    const overdueN     = acts.filter(a => a.status === "overdue" || a.status === "carried").length;
    const shortNoticeN = acts.filter(a => a.status === "shortnotice").length;
    const pagesAction  = acts.reduce((s, a) => s + (a.action || 0), 0);
    const pagesReview  = acts.reduce((s, a) => s + (a.review || 0), 0);
    const soonN        = acts.filter(a => a.hasStart && dleft(NOW, a.commence) >= 0 && dleft(NOW, a.commence) <= 90).length;
    // Two numbers, not five, and no longer two big boxes. As tiles they were the
    // hero-metric template — 145px of chrome stating figures you could not act
    // on. As a single line of type they cost ~30px, and each number is a way
    // into the rows it counts, so reading one and acting on it is the same
    // gesture. The first now also names the top band, which is where it lands.
    const stats = [
      { n:overdueN,     label:"to start now",      color:"#d4351c", filter:"escalate" },
      { n:shortNoticeN, label:"on short notice",   color:"#a8620a", filter:"shortnotice" },
      { n:acts.length,  label:"in the window",     color:"#0b0c0c", filter:"all" }
    ];

    // ---- overview rows: filter + sort ----
    const q = state.q.trim().toLowerCase();
    const ownerFilter = state.owner;
    // One order: commencement, the axis the bands are cut on. The Sort control
    // offered "suggested start date" as an alternative, but rows are grouped by
    // commencement — so choosing it shuffled rows *within* a date band into an
    // order the band heading contradicted. Worse, the default branch sorted on
    // `start_by` too (via the old `_sortKey`), so "Commencement date" never
    // actually sorted by commencement; lead times differ per item, so rows could
    // sit out of date order inside their own band. Start-by urgency is now
    // structural — it is the top band — which is what the control was reaching
    // for and could not deliver.
    let rowsActs = [...acts];
    rowsActs.sort((a, b) =>
      a.commence < b.commence ? -1 : a.commence > b.commence ? 1
      : (a.startBy || "") < (b.startBy || "") ? -1 : (a.startBy || "") > (b.startBy || "") ? 1 : 0);
    // One value covers both levels: "dept:Ministry of Justice" or a team name.
    if (ownerFilter !== "all") {
      rowsActs = ownerFilter.startsWith("dept:")
        ? rowsActs.filter(a => a.deptsSrc.includes(ownerFilter.slice(5)))
        : rowsActs.filter(a => a.ownersSrc.includes(ownerFilter));
    }
    if (state.type !== "all") rowsActs = rowsActs.filter(a => a.legType === state.type);
    rowsActs = rowsActs.filter(a => {
      if (prioFilter === "all") return true;
      if (prioFilter === "action") return a.action > 0;
      // T-098: the escalation page was this filter plus a group-by. An Act
      // escalates when its start-by has passed with nothing recorded, or it is
      // in force with pages still open — undone work, not merely a passed date.
      if (prioFilter === "escalate") return a.status === "overdue" || a.status === "carried";
      // The other half of the headline split: work the timetable left no runway
      // for. Reachable as a filter so the number in the summary line is a way in,
      // not just a statistic.
      if (prioFilter === "shortnotice") return a.status === "shortnotice";
      return (a.action + a.review) > 0;
    });
    if (q) rowsActs = rowsActs.filter(a => {
      const hay = (a.title + " " + a.ownersSrc.join(" ") + " " + a.pages.map(p => p.title).join(" ")).toLowerCase();
      return hay.includes(q);
    });
    const rows = rowsActs;

    // One control, both levels. Department and Team were two selects doing one
    // job, and the second had to be kept in sync with the first. An <optgroup>
    // says the same thing natively: pick your department heading or the team
    // under it, with keyboard and screen-reader behaviour for free.
    const byDeptTeams = new Map();
    for (const p of acts.flatMap(a => a.pages)) {
      if (!p.teamName) continue;
      const d = p.department || "Other bodies";
      if (!byDeptTeams.has(d)) byDeptTeams.set(d, new Set());
      byDeptTeams.get(d).add(p.teamName);
    }
    const ownerGroups = [...byDeptTeams.entries()].sort((x, y) => x[0] < y[0] ? -1 : 1)
      .map(([dept, teams]) => ({
        label: dept,
        // The department itself is selectable, so "everything under DfT" needs
        // no second control; its teams sit beneath it.
        options: [{ value: "dept:" + dept, label: "All of " + dept }].concat(
          [...teams].sort().map(t => ({ value: t, label: t }))
        ),
      }));

    // Counts come from the unfiltered set so the option itself says whether
    // picking it is worth it — an empty "Regulations and orders" is a fact
    // about the window, not a broken filter.
    const primaryN   = acts.filter(a => a.legType === "primary").length;
    const secondaryN = acts.filter(a => a.legType === "secondary").length;
    // Short enough to read inside the control. "Regulations and orders only (73)"
    // did not fit and clipped mid-word, which is worse than no count at all.
    const typeOptions = [
      { value:"all",       label:"Everything (" + (primaryN + secondaryN) + ")" },
      { value:"primary",   label:"Acts (" + primaryN + ")" },
      { value:"secondary", label:"Regulations, orders (" + secondaryN + ")" }
    ];

    // ---- time bands ----
    // The organising axis is WHEN, because a commencement date is the one thing
    // an item has exactly one of. Departments and teams are many-per-item, so
    // grouping on them duplicates: 73 items rendered as 196 rows across 32
    // groups, ten of them singletons and seven with none of their own pages
    // open. Filtering is the right tool for a many-to-many; banding for a date.
    //
    // Near bands are relative because that is how urgency is felt; far ones are
    // calendar months because that is how planning is done.
    // Bands must not overlap or the remainder reads as a mistake: a "next 30
    // days" band running into late August left an "August · 2 pages" band
    // beside it, which looks like August is nearly empty when most of it sat in
    // the band above. So: relative only within the current month, calendar
    // months after that. Every date lands in exactly one band.
    //
    // The first band is URGENCY, not date. Sorting purely by commencement put
    // the flagged work — past its start-by with nothing recorded — wherever its
    // commencement happened to fall, so an Act you should already have started
    // sat below a comfortable one merely because it lands later. The thing you
    // are behind on has to be the thing you see first. It is still a clean
    // partition: an item is either behind or it is in its date band, never both.
    const bandOf = a => {
      if (a.status === "overdue" || a.status === "carried") {
        return { key:"0", label:"Start now", tone:"red" };
      }
      const d = dleft(NOW, a.commence);
      if (d < 0) return { key:"1", label:"Already in force", tone:"red" };
      if (d <= 7) return { key:"2", label:"This week", tone:"amber" };
      const dt = new Date(a.commence + "T00:00:00");
      const now = new Date(NOW + "T00:00:00");
      if (dt.getFullYear() === now.getFullYear() && dt.getMonth() === now.getMonth()) {
        return { key:"3", label:"Later this month", tone:"amber" };
      }
      if (d > 365) return { key:"9", label:"More than a year away", tone:"far" };
      const y = dt.getFullYear();
      return {
        key: "4" + a.commence.slice(0, 7),
        label: MONF[dt.getMonth()] + (y === now.getFullYear() ? "" : " " + y),
        tone: d > 120 ? "far" : "near",
      };
    };
    // Why the top band exists, in the reader's terms. Only the flagged band gets
    // one — the date bands say what they are.
    // The board has no idea whether a team has started: it reads the law, and
    // nothing a reader of this page can do would tell it otherwise. Saying "no
    // work recorded" describes a record the reader cannot create, and reads as
    // an accusation of inaction rather than a fact about a date.
    const BAND_NOTE = { "Start now": "Their suggested start date has passed. This board follows the law, so it cannot see work already in hand." };
    const bandMap = new Map();
    for (const a of rows) {
      const b = bandOf(a);
      if (!bandMap.has(b.key)) bandMap.set(b.key, { label: b.label, tone: b.tone, rows: [] });
      bandMap.get(b.key).rows.push(a);
    }
    const groups = [...bandMap.entries()]
      .sort((x, y) => x[0] < y[0] ? -1 : 1)
      .map(([, g]) => {
        const pages = g.rows.reduce((s, a) => s + (a.action || 0) + (a.review || 0), 0);
        return {
          label: g.label,
          tone: g.tone,
          note: BAND_NOTE[g.label] || "",
          rows: g.rows,
          count: g.rows.length + (g.rows.length === 1 ? " change · " : " changes · ")
            + pages + (pages === 1 ? " page" : " pages"),
        };
      });

    const overview = {
      stats, rows, groups, ownerGroups, typeOptions,
      q:state.q, owner:state.owner, prio:state.prio, type:state.type,
      count: "Showing " + rows.length + " of " + acts.length,
      empty: rows.length === 0
    };

    // ---- act detail ----
    // The drill-in never inherits the worklist filters: hiding matched pages
    // here made the header count and the visible list disagree ("9 pages
    // matched" over 3 rows, T-078). Every matched page is reachable — the
    // Monitor bucket just renders collapsed (see actHTML).
    let act = null;
    if (state.view === "act" && state.actIdx != null && acts[state.actIdx]) {
      const a = acts[state.actIdx];
      act = { ...a, pageCountLabel:a.pageCount + " page" + (a.pageCount === 1 ? "" : "s") + " matched" };
    }

    // ---- page detail ----
    let page = null;
    if (state.view === "page" && state.actIdx != null && state.pageIdx != null && acts[state.actIdx]) {
      const a = acts[state.actIdx];
      page = a.pages.find(x => x.pi === state.pageIdx) || a.pages[0] || null;
    }

    // ---- horizon lane (T-082) ----
    // Pre-enactment bills at late parliamentary stages. Deliberately a
    // separate, plainly-labelled list: no dates exist yet, so these rows get
    // no timeline geometry, no start-by and no status ramp — early warning,
    // not commitments.
    const horizon = ((Q.horizon && Q.horizon.items) || []).map(h => ({
      title: h.title || "",
      stage: (h.current_stage || "") + (h.current_house ? " · " + h.current_house : ""),
      lastUpdate: h.last_update || "",
      billUrl: h.bill_url || "",
      note: h.note || "",
      pageCount: h.page_count || 0,
      pages: (h.affected_pages || []).map(p => ({ url:p.url, title:p.title || p.url })),
    }));

    // ---- due-for-review lane (T-071) ----
    // Event-driven review prompts: a page lands here when a real change event
    // touched it (commencement, fresh amendment, apparent value contradiction,
    // silent body change) — or, failing any of those, when its stored review
    // date elapsed. A heads-up to review, not a claim that anything is wrong.
    // Presented GROUPED BY THE CHANGE THAT TRIGGERED THEM, because that is what
    // the lane actually is. Rendered flat, 64 rows carried the same chip
    // ("change now in force") and the same owner over and over, never naming
    // *which* change — so the reader could not connect a page here to the item
    // above that caused it, and the 12-row cap meant only the first change's
    // pages were ever visible. Those 64 rows are three changes. The commencement
    // signal always names legislation[0] (60/60 in the live payload), so the
    // grouping key needs no guessing.
    const REVIEW_SIGNAL_LABELS = {
      amendment_effect: "law amended again",
      value_contradiction: "may state an old value",
      silent_page_change: "page changed quietly",
      review_elapsed: "review date passed",
    };
    const reviewGroups = (() => {
      const bySlug = new Map(Q.items.map(it => [it.legislation_url, "#/act/" + actSlug(it)]));
      const groups = new Map();
      for (const r of ((Q.review || {}).due) || []) {
        const lead = (r.legislation || [])[0] || null;
        const key = lead ? lead.url : "__other__";
        if (!groups.has(key)) {
          groups.set(key, {
            title: lead ? lead.title.replace(/^The\s+/, "") : "Other reasons to look",
            date: lead ? lead.date || "" : "",
            // Straight back to the same detail page the worklist row opens —
            // the relationship between the two sections, made clickable.
            href: lead ? (bySlug.get(lead.url) || lead.url) : "",
            owners: new Set(), pages: [],
          });
        }
        const g = groups.get(key);
        // `deptOf`, not `shortOwner`: shortOwner returns "GDS GOV.UK · DVLA",
        // and a value containing " · " inside a line whose own separator is
        // " · " reads as one long run of unrelated words.
        if (r.owner) g.owners.add(deptOf(r.owner));
        g.pages.push({
          url: r.url || "",
          title: r.title || r.url || "",
          // Only reasons the group heading does NOT already imply. Every page
          // under a commenced change is here because it commenced; repeating
          // that on all 26 of them is ink that says nothing.
          flags: (r.signals || [])
            .map(s => REVIEW_SIGNAL_LABELS[s.signal])
            .filter(Boolean),
        });
      }
      return [...groups.values()]
        .sort((a, b) => b.pages.length - a.pages.length)
        .map(g => {
          // A reason every page shares belongs to the group, not to each page.
          // Two groups here are driven entirely by a value contradiction, and
          // stamping "(may state an old value)" on all of their pages repeated
          // the heading once per row.
          const shared = g.pages.length && g.pages[0].flags.length
            ? g.pages[0].flags.filter(f => g.pages.every(p => p.flags.includes(f)))
            : [];
          const pages = shared.length
            ? g.pages.map(p => ({ ...p, flags: p.flags.filter(f => !shared.includes(f)) }))
            : g.pages;
          // "In force 1 Oct" for a date three months away is simply false. The
          // lane is not only commenced changes: a page can be flagged for
          // stating a value the new law supersedes BEFORE that law lands.
          // <= 0, not < 0: something commencing today is in force today.
          const past = g.date ? dleft(NOW, g.date) <= 0 : false;
          return {
            ...g,
            pages,
            owners: [...g.owners],
            ownerLine: [...g.owners].slice(0, 3).join(", ")
              + (g.owners.size > 3 ? " +" + (g.owners.size - 3) : ""),
            dateLabel: g.date ? (past ? "In force " : "Comes into force ") + fmtMed(g.date) : "",
            sharedLabel: shared.join(", "),
            countLabel: g.pages.length + " page" + (g.pages.length === 1 ? "" : "s"),
          };
        });
    })();
    const reviewTotal = (((Q.review || {}).due) || []).length;

    // ---- prospective lane (T-090) ----
    // Enacted provisions with no commencement date appointed yet. Like the
    // horizon lane, no dates exist — so no timeline, no start-by, no status
    // ramp. A longer-term backlog, plainly labelled, not a set of deadlines.
    const prospective = ((Q.prospective && Q.prospective.items) || []).map(x => ({
      title: x.legislation_title || "",
      url: x.legislation_url || "",
      provisionCount: x.provision_count || 0,
      alsoOnWorklist: !!x.also_on_worklist,
      pageCount: x.page_count || 0,
      pages: (x.affected_pages || []).map(p => ({ url:p.url, title:p.title || p.url })),
      // Stated commencement aims (T-119): quoted, sourced statements only.
      // Rendered as aims, never as dates — nothing here has a date.
      windows: (x.expected_windows || []).map(w => ({
        window: w.window || "",
        scope: w.scope || "",
        sourceTitle: w.source_title || "",
        sourceUrl: w.source_url || "",
        statedOn: w.stated_on || "",
      })),
    }));

    return {
      loading:false,
      isOverview: state.view === "overview",
      isAct: state.view === "act" && !!act,
      isPage: state.view === "page" && !!page,
      header: { updated:headerUpdated },
      overview, act, page, horizon, prospective,
      review: { groups: reviewGroups, total: reviewTotal }
    };
  }

  // ============================== HTML builders ==============================
  // Masthead, not a hero. Two facts: whose wire this is, and how fresh it is.
  // The old second meta line ("Commencement orders · 86 of 86 in window ·
  // LLM-verified") described how the board was assembled — a reassurance about
  // the machine that a content designer cannot act on and did not ask for.
  function headerHTML(vm) {
    return ''
    + '<header style="background:#0b1f35;border-bottom:3px solid #1d70b8;view-transition-name:ew-header">'
    +   '<div class="ew-header-inner" style="max-width:1120px;margin:0 auto;padding:11px 24px;display:flex;align-items:baseline;justify-content:space-between">'
    +     '<span style="font-family:var(--font-heading);font-weight:700;color:#fff;font-size:19px;letter-spacing:-.01em">EventWire</span>'
    +     '<span class="ew-header-meta" style="color:#c3d3e3;font-size:12px;white-space:nowrap">' + esc(vm.header.updated) + '</span>'
    +   '</div>'
    + '</header>';
  }

  // One line of type where two 28px tiles used to be. Each figure is a button
  // that narrows the list to exactly the rows it counts, so the number and the
  // way to act on it are the same object.
  function statsHTML(stats, prio) {
    return stats.map((s, i) =>
      (i ? '<span aria-hidden="true" style="color:#b1b4b6">·</span>' : '')
      + '<button type="button" class="ew-stat" data-stat="' + esc(s.filter) + '"'
      + ' aria-pressed="' + (s.filter === prio ? "true" : "false") + '">'
      +   '<span style="font-family:var(--font-heading);font-weight:700;font-size:21px;line-height:1;color:' + s.color + '">' + esc(s.n) + '</span>'
      +   '<span class="ew-stat-label t-caption t-secondary">' + esc(s.label) + '</span>'
      + '</button>').join("");
  }

  function optionsHTML(opts, sel) {
    return opts.map(o => '<option value="' + esc(o.value) + '"' + (o.value === sel ? " selected" : "") + '>' + esc(o.label) + '</option>').join("");
  }

  // Teams nested under their department. <optgroup> is the native way to say
  // "these belong together", so it needs no second control and no dependent
  // state to keep in sync.
  function ownerOptionsHTML(groups, sel) {
    return optionsHTML([{ value:"all", label:"All teams" }], sel)
      + groups.map(g => '<optgroup label="' + esc(g.label) + '">'
          + optionsHTML(g.options, sel) + '</optgroup>').join("");
  }

  // A wire line, not a card. One row per item, scannable in a single pass:
  // when · what · how much · who. The per-row timeline moved to the item page,
  // where there is room for it to mean something; here it cost 60px of height
  // per row and said less than the date it sits beside.
  const chip = (label, bg, ink, title) =>
    '<span' + (title ? ' title="' + esc(title) + '"' : '')
    + ' style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;'
    + 'white-space:nowrap;padding:1px 6px;border-radius:3px;background:' + bg + ';color:' + ink + '">'
    + esc(label) + '</span>';

  // The date is the one element every row has, sits at the start of the scan, and
  // was carrying no information beyond its own value. Inking it by urgency turns
  // the left edge into a colour spine you can read down at a glance — and it is
  // never the only carrier: the band, the flags and the counts all say it too.
  const DATE_INK = {
    overdue:"#d4351c", carried:"#d4351c", shortnotice:"#a8620a", startnow:"#9c4915",
    inprogress:"#1d70b8", done:"#00703c", ontrack:"#0b0c0c", monitor:"#687074"
  };

  function overviewRowHTML(it, band) {
    // A status chip in a band that already means the same thing says nothing:
    // with a 4–6 week lead time, everything in "Start now", "Already in force"
    // or "This week" is past its start-by by definition. Flags earn their place
    // only where they are NOT implied.
    const impliedByBand = band === "Start now" || band === "Already in force" || band === "This week";
    // ONE fixed slot, so the flags column starts at the same x on every row
    // instead of trailing a title of arbitrary length — and ONE flag in it.
    // Two chips need 152px in the worst case, and buying that width out of the
    // title column to serve a handful of rows is a bad trade; clipping the
    // second chip instead just looks broken. So they are ranked and the row
    // shows its most consequential one: the timetable status first (it explains
    // the date), then unresolved ownership (it blocks the work being routed at
    // all), then the Act marker (useful, but nothing turns on it).
    const flags = [];
    if (!impliedByBand && it.statusKey === "shortnotice") flags.push(chip("short notice", "#fdf0dc", "#7a4a00", it.bannerLine));
    else if (!impliedByBand && (it.statusKey === "overdue" || it.statusKey === "carried")) flags.push(chip(it.statusLabel, it.statusTint, it.statusInk));
    if (it.needsRouting) flags.push(chip("owner?", "#f3f2f1", "#505a5f", "Published by an organisation that has closed and was split up, so who owns these pages now needs deciding"));
    // Mark the exception, not the rule. 73 of 86 items are instruments, so a
    // REGS chip on nearly every row was ink spent to say "normal"; the 13 Acts
    // are the rare, wide-reaching ones and are worth spotting.
    if (it.legType === "primary") flags.push(chip("Act", "#e8f1f8", "#144e81", "An Act of Parliament, not an instrument made under one"));
    return ''
    + '<a class="ew-row" href="' + esc(it.href) + '" title="' + esc(it.title) + '" style="display:grid;grid-template-columns:52px minmax(0,1fr) 100px 150px 176px;gap:12px;align-items:baseline;padding:7px 8px;margin:0 -8px;border-top:1px solid #ebe9e6;text-decoration:none;color:inherit">'
    +   '<time datetime="' + esc(it.commence) + '" class="t-caption" style="font-variant-numeric:tabular-nums;font-weight:700;color:' + (DATE_INK[it.statusKey] || "#0b0c0c") + ';white-space:nowrap">' + esc(it.dayLabel) + '</time>'
    +   '<span style="min-width:0;font-family:var(--font-heading);font-weight:650;font-size:14px;line-height:1.35;letter-spacing:-.01em;color:#0b0c0c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(it.rowTitle || it.title) + '</span>'
    +   '<span class="ew-flags" style="display:flex;align-items:baseline;min-width:0;overflow:hidden">' + (flags[0] || "") + '</span>'
    // Who would do the work is the axis the reader is really filtering on — they
    // are one team among ~88 — so it reads at secondary weight, not muted.
    +   '<span class="ew-owner t-caption t-secondary" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(it.ownerLine) + '</span>'
    +   '<span class="ew-counts t-caption" style="text-align:right;white-space:nowrap">'
    +     (it.updateText ? '<span style="color:#0b0c0c;font-weight:700">' + esc(it.updateText) + '</span>' : '')
    +     (it.updateText && it.reviewText ? '<span class="t-muted"> · </span>' : '')
    +     (it.reviewText ? '<span class="t-muted">' + esc(it.reviewText) + '</span>' : '')
    +   '</span>'
    + '</a>';
  }

  function overviewRowsHTML(ov) {
    if (ov.empty) {
      // The escalation filter finding nothing is good news, not an empty result.
      return ov.prio === "escalate"
        ? '<div style="padding:30px 0;text-align:center;color:#00703c;font-weight:600">Nothing overdue and nothing in force with work still open.</div>'
        : '<div style="padding:30px 0;text-align:center;color:#687074">No legislation matches these filters.</div>';
    }
    // Bands are headings, not containers — a rule and a label the eye skips to.
    // They partition rather than duplicate, which grouping by department could
    // not: an Act touches many departments, so it rendered under each and 73
    // items became 196 rows across 32 collapsed accordions.
    //
    // The rule carries the urgency: red and heavy at the top, thinning to a hair
    // rule and grey type for months that are still a long way off. Weight decays
    // down the page, so the eye is pulled to the work that is actually pressing
    // instead of treating thirteen months as thirteen equals.
    const TONE = {
      red:   { rule:"2px solid #d4351c", ink:"#942514" },
      amber: { rule:"2px solid #a8620a", ink:"#7a4a00" },
      near:  { rule:"2px solid #0b0c0c", ink:"#0b0c0c" },
      far:   { rule:"1px solid #b1b4b6", ink:"#505a5f" }
    };
    return ov.groups.map(g => {
      const t = TONE[g.tone] || TONE.near;
      return ''
      + '<section style="margin-top:' + (g.note ? 18 : 22) + 'px">'
      +   '<h2 class="t-overline" style="font-size:11px;color:' + t.ink + ';margin:0 0 2px;padding-bottom:5px;border-bottom:' + t.rule + ';display:flex;gap:8px;align-items:baseline;justify-content:space-between">'
      +     '<span>' + esc(g.label) + '</span>'
      +     '<span class="t-caption" style="color:' + t.ink + ';font-weight:400;text-transform:none;letter-spacing:0">' + esc(g.count) + '</span>'
      +   '</h2>'
      +   (g.note ? '<p class="t-caption t-muted" style="margin:5px 0 0">' + esc(g.note) + '</p>' : '')
      +   g.rows.map(it => overviewRowHTML(it, g.label)).join("")
      + '</section>';
    }).join("");
  }

  function overviewHTML(vm) {
    const ov = vm.overview;
    return ''
    + '<main class="ew-main" style="max-width:1120px;margin:0 auto;padding:20px 24px 0">'
    // Heading and headline figures on ONE line. The overline, the 32px title and
    // a two-line paragraph explaining what the board is took 130px above the
    // fold to say what the masthead and the column headings already say — and
    // the reader arriving each morning has read it before.
    +   '<div class="ew-head" style="display:flex;align-items:baseline;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;margin-bottom:12px">'
    +     '<h1 class="t-h4" style="font-size:23px">Upcoming changes to check</h1>'
    +     '<div class="ew-stats" style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">' + statsHTML(ov.stats, ov.prio) + '</div>'
    +   '</div>'
    // The filter bar is fixed to the top of the list it governs rather than
    // floating above it, so it reads as the list's own controls.
    +   '<div style="background:#fff;border:1px solid #e1dfdc;box-shadow:0 1px 3px rgba(0,0,0,.05)">'
    +     '<div class="ew-filters" style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;padding:12px 20px;background:#fbfaf9;border-bottom:1px solid #e1dfdc">'
    +       '<label class="ew-field" style="flex:1 1 230px">'
    +         '<span class="ew-flabel">Search</span>'
    +         '<input type="search" data-ctl="q" placeholder="Legislation, page or team" value="' + esc(ov.q) + '">'
    +       '</label>'
    +       '<label class="ew-field" style="flex:0 1 208px">'
    +         '<span class="ew-flabel">Team</span>'
    +         '<select data-ctl="owner">' + ownerOptionsHTML(ov.ownerGroups, ov.owner) + '</select>'
    +       '</label>'
