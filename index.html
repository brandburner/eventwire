    +       '<label class="ew-field" style="flex:0 1 196px">'
    +         '<span class="ew-flabel">Show</span>'
    +         '<select data-ctl="prio">'
    +           optionsHTML([{value:"review",label:"Needing work"},{value:"action",label:"With pages to update"},{value:"escalate",label:"To start now"},{value:"shortnotice",label:"On short notice"},{value:"all",label:"Everything"}], ov.prio)
    +         '</select>'
    +       '</label>'
    +       '<label class="ew-field" style="flex:0 1 196px">'
    +         '<span class="ew-flabel">Type</span>'
    +         '<select data-ctl="type">' + optionsHTML(ov.typeOptions, ov.type) + '</select>'
    +       '</label>'
    +       '<span class="t-caption t-muted" id="ew-count" style="margin-left:auto;padding-bottom:9px;white-space:nowrap">' + esc(ov.count) + '</span>'
    +     '</div>'
    // The timeline axis went with the per-row timelines. It labelled a track the
    // rows no longer draw, and the bands now say when far more directly.
    +     '<div style="padding:2px 20px 20px">'
    +       '<div id="ew-rows">' + overviewRowsHTML(ov) + '</div>'
    +     '</div>'
    +   '</div>'
    // Read down the page, the sections now descend by how settled things are:
    // dated and coming (the worklist) -> already happened (review) -> no date
    // at all. Horizon and prospective were the other way round, which put a
    // bill that is not law yet ABOVE an Act that already is.
    +   reviewHTML(vm.review)
    +   noDatesHTML(vm)
    + '</main>';
  }

  // One way of showing "here are the pages", used by all three lower blocks.
  // They previously each invented their own: the review lane made every page a
  // heading-sized row, while the other two ran them inline. Layout variety is
  // fine where it signals a different KIND of thing — colour and framing do
  // that here — but the same object should be presented the same way, or the
  // reader has to re-learn the pattern three times down one page.
  const MAX_PAGE_LINKS = 6;
  function pageRunHTML(pages, total) {
    if (!pages.length) return "";
    const shown = pages.slice(0, MAX_PAGE_LINKS).map(p =>
      '<a href="' + esc(p.url) + '" target="_blank" rel="noopener" style="color:#1d70b8">' + esc(p.title) + '</a>'
      + ((p.flags && p.flags.length)
          ? ' <span class="t-muted" style="font-size:11px">(' + esc(p.flags.join(", ")) + ')</span>'
          : "")
    ).join('<span class="t-muted"> · </span>');
    const more = (total || pages.length) - Math.min(pages.length, MAX_PAGE_LINKS);
    return '<div class="t-caption t-secondary" style="line-height:1.6;margin-top:4px">'
      + shown + (more > 0 ? '<span class="t-muted"> · +' + more + ' more</span>' : '')
      + '</div>';
  }

  // A block heading that says what the block is and how big it is.
  function laneHeadHTML(label, ink, count, lead) {
    return '<div class="t-overline" style="color:' + ink + ';display:flex;gap:10px;align-items:baseline;justify-content:space-between">'
      + '<span>' + esc(label) + '</span>'
      + (count ? '<span class="t-caption" style="color:' + ink + ';font-weight:400;text-transform:none;letter-spacing:0">' + esc(count) + '</span>' : '')
      + '</div>'
      + '<p class="t-caption t-secondary" style="max-width:760px;margin:5px 0 10px">' + lead + '</p>';
  }

  // "Due for review" — event-driven review prompts (T-071), grouped by the
  // change that triggered them. The group heading carries the relationship the
  // flat list could not: it names the change, and clicking it opens the very
  // same detail page the worklist row above opens.
  function reviewHTML(review) {
    const groups = (review && review.groups) || [];
    if (!groups.length) return "";
    const n = groups.length;
    return ''
    + '<div style="background:#f4f8fb;border:1px solid #b7cfe3;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:14px 20px 18px;margin-top:26px">'
    +   laneHeadHTML("Due for review", "#144e81",
          n + " change" + (n === 1 ? "" : "s") + " · " + review.total + " page" + (review.total === 1 ? "" : "s"),
          "Pages worth checking <strong>now</strong>, grouped under the change that flagged them — "
          + "the same changes listed above, so a heading here opens the same page a row up there does. "
          + "Most are here because the change has come into force; a few because the page may already "
          + "state a value the new law replaces. A prompt to check, not a finding of error.")
    +   groups.map(g => ''
        + '<div style="padding:11px 8px 12px;margin:0 -8px;border-top:1px solid #d3e2ee">'
        +   '<a href="' + esc(g.href) + '" style="font-family:var(--font-heading);font-weight:650;font-size:14px;line-height:1.3;color:#0b0c0c;text-decoration:none;border-bottom:1px solid #9dbdd8">' + esc(g.title) + '</a>'
        +   '<div class="t-caption t-muted" style="margin-top:3px">'
        +     esc([g.dateLabel, g.sharedLabel, g.ownerLine || "no owner routed", g.countLabel]
                .filter(Boolean).join(" · "))
        +   '</div>'
        +   pageRunHTML(g.pages, g.pages.length)
        + '</div>').join("")
    + '</div>';
  }

  // The two dateless lanes share a heading, because their whole similarity —
  // no date, so nothing to schedule — is exactly what made them read as
  // duplicates of each other. Said once, the space below is free to state the
  // one thing that actually differs: how settled the law is.
  function noDatesHTML(vm) {
    const p = prospectiveHTML(vm.prospective);
    const h = horizonHTML(vm.horizon);
    if (!p && !h) return "";
    return ''
    + '<section style="margin-top:30px">'
    +   '<h2 class="t-overline" style="font-size:11px;margin:0;padding-bottom:5px;border-bottom:1px solid #b1b4b6;color:#505a5f">No dates yet</h2>'
    +   '<p class="t-caption t-muted" style="max-width:760px;margin:7px 0 0">'
    +     'Neither of these has a commencement date, so neither has a deadline and neither is on the worklist. '
    +     'They differ in how settled the law is — the first is finished and waiting, the second could still change.'
    +   '</p>'
    +   p + h
    + '</section>';
  }

  // "On the horizon" — pre-enactment bills (T-082). Visually distinct from the
  // dated worklist (dashed border, amber chip) and honest about uncertainty:
  // these have no in-force dates, no start-by, and may still change.
  function horizonHTML(rows) {
    if (!rows || !rows.length) return "";
    const rowHTML = h => ''
      + '<div style="display:grid;grid-template-columns:300px 1fr 150px;gap:16px;align-items:center;padding:11px 8px;margin:0 -8px;border-top:1px solid #ebe9e6">'
      +   '<div>'
      // Likewise no "EARLY WARNING" chip — the block heading and its lead line
      // already say the bill is not law yet, which is the whole warning.
      +     '<div style="font-family:var(--font-heading);font-weight:650;font-size:15px;line-height:1.25;color:#0b0c0c">' + esc(h.title) + '</div>'
      +     '<div class="t-caption t-muted" style="margin-top:2px">' + esc(h.stage) + (h.lastUpdate ? ' · updated ' + esc(h.lastUpdate) : '') + '</div>'
      +   '</div>'
      +   '<div class="t-caption t-secondary" style="line-height:1.5">'
      +     (h.pages.length ? 'Pages it could affect:' : '')
      +     pageRunHTML(h.pages, h.pageCount)
      +   '</div>'
      +   '<div style="text-align:right">'
      +     '<div class="t-body-sm" style="font-weight:600;font-size:13px;color:#0b0c0c">' + h.pageCount + ' page' + (h.pageCount === 1 ? '' : 's') + '</div>'
      +     (h.billUrl ? '<a href="' + esc(h.billUrl) + '" target="_blank" rel="noopener" style="font-size:12px;color:#1d70b8;font-weight:600">Bill progress ↗</a>' : '')
      +   '</div>'
      + '</div>';
    return ''
    + '<div style="background:#fffbf5;border:1px dashed #f47738;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:14px 20px 18px;margin-top:16px">'
    +   laneHeadHTML("Still going through Parliament", "#a04d0a",
          rows.length + " bill" + (rows.length === 1 ? "" : "s"),
          "Not law yet, and the wording can still change before it is — so anything written now may need rewriting. "
          + "The earliest warning available. A bill joins the worklist once it passes and its dates are set.")
    +   rows.map(rowHTML).join("")
    + '</div>';
  }

  // "Enacted — not yet commenced" (T-090). A longer-term radar: real law already
  // on the statute book whose commencement date has not been appointed. Like the
  // horizon lane it is dateless — no start-by, no deadline — and visually distinct
  // (dotted grey) so it never reads as a commitment.
  function prospectiveHTML(rows) {
    if (!rows || !rows.length) return "";
    const rowHTML = x => ''
      + '<div style="display:grid;grid-template-columns:300px 1fr 150px;gap:16px;align-items:center;padding:11px 8px;margin:0 -8px;border-top:1px solid #ebe9e6">'
      +   '<div>'
      // No "NO DATE YET" chip: the block is called "waiting for a start date",
      // under a heading that says "No dates yet". Stamping it on every row is
      // the third telling, and it pushed the Act's name — the thing you scan
      // for — down the row.
      +     '<div style="font-family:var(--font-heading);font-weight:650;font-size:15px;line-height:1.25;color:#0b0c0c">' + esc(x.title) + '</div>'
      +     '<div class="t-caption t-muted" style="margin-top:2px">' + x.provisionCount + ' provision' + (x.provisionCount === 1 ? '' : 's') + ' awaiting commencement'
      +       (x.alsoOnWorklist ? ' · some already dated on the worklist' : '') + '</div>'
      // A stated aim is government's quoted words, not an appointed date, and
      // must never carry a date's typographic authority: amber ink, aim-first
      // copy, source named. Full-border/tint treatments only (no side stripes).
      +     (x.windows || []).map(w => ''
      +       '<div class="t-caption" style="margin-top:6px;color:var(--color-amber-ink)">Ministers have said: <b>' + esc(w.window) + '</b> — an aim they stated, not a set date</div>'
      +       (w.scope ? '<div class="t-caption t-muted" style="margin-top:1px">' + esc(w.scope) + '</div>' : '')
      +       (w.sourceTitle ? '<div class="t-caption t-muted" style="margin-top:1px">Said in: '
      +         (w.sourceUrl ? '<a href="' + esc(w.sourceUrl) + '" target="_blank" rel="noopener" style="color:inherit">' + esc(w.sourceTitle) + '</a>' : esc(w.sourceTitle))
      +         (w.statedOn ? ' (' + esc(w.statedOn) + ')' : '') + '</div>' : '')
      +     '').join('')
      +   '</div>'
      +   '<div class="t-caption t-secondary" style="line-height:1.5">'
      +     (x.pages.length ? 'Pages it will affect:' : '')
      +     pageRunHTML(x.pages, x.pageCount)
      +   '</div>'
      +   '<div style="text-align:right">'
      +     '<div class="t-body-sm" style="font-weight:600;font-size:13px;color:#0b0c0c">' + x.pageCount + ' page' + (x.pageCount === 1 ? '' : 's') + '</div>'
      +     (x.url ? '<a href="' + esc(x.url) + '" target="_blank" rel="noopener" style="font-size:12px;color:#1d70b8;font-weight:600">Read the Act ↗</a>' : '')
      +   '</div>'
      + '</div>';
    return ''
    + '<div style="background:#fafafa;border:1px dotted #9aa2ab;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:14px 20px 18px;margin-top:16px">'
    +   laneHeadHTML("Already law — waiting for a start date", "#4c5560",
          rows.length + " Act" + (rows.length === 1 ? "" : "s"),
          "Passed and final: the wording will not change now. All that is missing is the date ministers appoint "
          + "for it to take effect, which can be years. Each one joins the worklist the day it gets a date. "
          + "Where ministers have publicly said when they aim to switch a change on, that is shown — their stated aim, not a date.")
    +   rows.map(rowHTML).join("")
    + '</div>';
  }

  function actHTML(vm) {
    const a = vm.act;
    // Affected-content team filter (T-103) + per-group pagination (T-104). A user
    // with a large Act (100+ affected pages) can narrow to their own team and the
    // long groups reveal the tail on demand rather than rendering all at once.
    const allPages = a.groups.flatMap(g => g.items);
    const teamOf = p => p.contentTeam || p.ownerOrg || p.ownerShort;
    const teamSet = new Set(allPages.map(teamOf).filter(Boolean));
    const teamOpts = [{ value:"all", label:"All teams" }]
      .concat([...teamSet].sort().map(t => ({ value:t, label:t })));
    const activeTeam = teamSet.has(state.team) ? state.team : "all";
    const teamMatch = p => activeTeam === "all" || teamOf(p) === activeTeam;
    const filteredTotal = allPages.filter(teamMatch).length;
    const PAGE_CAP = 25;   // rows shown per group before a native "show more"
    const commHTML = a.commencements.map(c =>
      '<div style="background:#fff;border:1px solid #e1dfdc;box-shadow:0 1px 3px rgba(0,0,0,.05)">'
      + '<div style="display:flex;gap:12px;align-items:baseline;padding:12px 20px;border-bottom:1px solid #ebe9e6;flex-wrap:wrap">'
      +   '<span style="font-weight:650;font-family:var(--font-heading);font-size:16px;color:' + c.color + '">' + esc(c.dateFull) + '</span>'
      +   '<span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#505a5f">' + esc(c.tagLabel) + '</span>'
      +   '<span class="t-caption t-muted" style="margin-left:auto">' + esc(c.countLabel) + '</span>'
      + '</div>'
      + '<div style="padding:4px 20px 8px">'
      + c.provisions.map(p =>
          '<div style="display:flex;gap:14px;padding:9px 0;border-top:1px solid #f3f1ef;align-items:baseline">'
          + '<span title="' + esc(p.refFull) + '" style="flex:none;min-width:74px;font-family:var(--font-mono,monospace);font-size:13px;color:#0b0c0c">'
          +   '<span style="font-weight:700">' + esc(p.refMain) + '</span>'
          +   (p.refDetail ? '<span style="font-weight:400;color:#8a9196;font-size:12px"> ' + esc(p.refDetail) + '</span>' : '')
          + '</span>'
          + '<div style="flex:1;min-width:0">'
          +   '<div class="t-body-sm" style="color:#0b0c0c;line-height:1.35">' + esc(p.subject) + '</div>'
          +   '<div class="t-caption t-muted" style="margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">'
          +     (p.qual ? '<span>' + esc(p.qual) + '</span>' : '')
          +     (p.sourceUrl ? (p.qual ? '<span style="opacity:.4">·</span>' : '') + '<a href="' + esc(p.sourceUrl) + '" target="_blank" rel="noopener" style="color:#1d70b8">' + esc(p.sourceLead) + esc(p.sourceLabel) + '</a>' : '')
          +   '</div>'
          + '</div>'
          + '</div>').join("")
      + '</div>'
      + '</div>').join("");

    const futureMeasureRowHTML = m => {
      const pageLinks = m.pages.slice(0, 3).map(p =>
        '<a href="' + esc(p.url) + '" target="_blank" rel="noopener" style="color:#1d70b8">' + esc(p.title) + '</a>'
      ).join(' · ');
      return '<div style="display:grid;grid-template-columns:minmax(74px,auto) 1fr;gap:12px;padding:9px 0;border-top:1px solid #ebe9e6;align-items:baseline">'
        + '<span title="' + esc(m.ref) + '" style="font-family:var(--font-mono,monospace);font-size:12px;white-space:nowrap;color:#0b0c0c">'
        +   (m.refMain ? '<strong>' + esc(m.refMain) + '</strong>' : '<span class="t-muted">Measure</span>')
        +   (m.refDetail ? ' <span class="t-muted">' + esc(m.refDetail) + '</span>' : '')
        + '</span>'
        + '<div><div class="t-body-sm" style="color:#0b0c0c;line-height:1.35">' + esc(m.subject) + '</div>'
        +   (pageLinks ? '<div class="t-caption t-muted" style="margin-top:2px;line-height:1.45">May affect ' + pageLinks + (m.pages.length > 3 ? ' · +' + (m.pages.length - 3) + ' more' : '') + '</div>' : '')
        + '</div></div>';
    };
    const futureHTML = a.futureProvisionCount
      ? (() => {
          const shown = (a.futureMeasures || []).slice(0, 6);
          const rest = (a.futureMeasures || []).slice(6);
          const connected = a.futureMeasures.length;
          const summary = a.futureProvisionCount + ' provision' + (a.futureProvisionCount === 1 ? '' : 's') + ' still await commencement dates.'
            + (connected
                ? ' ' + connected + ' matched measure' + (connected === 1 ? ' is' : 's are') + ' connected to ' + a.futurePageCount + ' GOV.UK page' + (a.futurePageCount === 1 ? '' : 's') + '.'
                : ' No page-specific measure matches were found.');
          return '<div style="margin:0 0 24px">'
            + '<div class="t-overline">Other measures without dates</div>'
            + '<div style="background:#fafafa;border:1px dotted #9aa2ab;padding:12px 20px">'
            + '<p class="t-body-sm t-secondary" style="margin:0 0 8px">' + esc(summary) + ' These are prompts to keep in view, not work with a deadline.</p>'
            + shown.map(futureMeasureRowHTML).join('')
            + (rest.length ? '<details style="border-top:1px solid #ebe9e6;padding-top:8px"><summary class="t-caption" style="cursor:pointer;color:#1d70b8;font-weight:600">Show ' + rest.length + ' more matched measure' + (rest.length === 1 ? '' : 's') + '</summary>' + rest.map(futureMeasureRowHTML).join('') + '</details>' : '')
            + '</div></div>';
        })()
      : '';

    // Every matched page renders — the Monitor bucket is collapsed by default
    // (native <details>) rather than hidden, so the "N pages matched" header
    // always agrees with what's on screen.
    const groupsHTML = a.groups.map(g => {
      const items = g.items.filter(teamMatch);
      if (!items.length) return "";   // group empty under the active team filter
      // Keep the group header count honest when a team filter is applied.
      const countLabel = activeTeam === "all"
        ? g.count
        : (items.length + " page" + (items.length === 1 ? "" : "s"));
      const head = expandHint =>
        '<div style="display:flex;align-items:center;gap:9px;padding:7px 12px;background:' + g.tint + '">'
        + '<span style="font-family:var(--font-heading);font-weight:650;font-size:14px;white-space:nowrap;color:' + g.ink + '">' + esc(g.label) + '</span>'
        + '<span class="t-caption" style="color:' + g.ink + ';opacity:.85">' + esc(countLabel) + (activeTeam === "all" && g.hint ? ' · ' + esc(g.hint) : '') + '</span>'
        + (expandHint ? '<span class="t-caption" style="margin-left:auto;color:' + g.ink + ';font-weight:600">' + expandHint + '</span>' : '')
        + '</div>';
      // Pagination (T-104): show the first PAGE_CAP rows, reveal the rest via a
      // native <details> so a 100+ list is a short scroll until expanded.
      const shown = items.slice(0, PAGE_CAP);
      const rest = items.slice(PAGE_CAP);
      const cards = shown.map(p => actPageCardHTML(p, a.idx, a.uniformMatchLabel)).join("")
        + (rest.length
            ? '<details style="border:1px solid #e1dfdc;border-top:none">'
              + '<summary style="cursor:pointer;list-style:none;padding:11px 16px;color:#1d70b8;font-weight:600;font-size:13px;font-family:var(--font-stack)">'
              + '<span class="ew-more-closed">Show ' + rest.length + ' more page' + (rest.length === 1 ? '' : 's') + ' ▸</span>'
              + '<span class="ew-more-open">Show fewer ▴</span></summary>'
              + rest.map(p => actPageCardHTML(p, a.idx, a.uniformMatchLabel)).join("")
              + '</details>'
            : "");
      if (g.key === "monitor") {
        return '<details style="margin-bottom:18px">'
          + '<summary style="cursor:pointer;list-style:none">'
          + head('<span class="ew-closed-only">show pages ▸</span><span class="ew-open-only">hide pages ▴</span>')
          + '</summary>'
          + cards
          + '</details>';
      }
      return '<div style="margin-bottom:18px">' + head('') + cards + '</div>';
    }).join("")
    || '<div style="padding:24px 0;color:#687074">' + (activeTeam === "all"
          ? 'No GOV.UK pages matched this ' + (a.legType === "secondary" ? "instrument" : "Act") + '.'
          : 'No affected pages for ' + esc(activeTeam) + ' on this ' + (a.legType === "secondary" ? "instrument" : "Act") + '.') + '</div>';

    return ''
    + '<main class="ew-main" style="max-width:1000px;margin:0 auto;padding:22px 24px 0">'
    +   '<nav aria-label="Breadcrumb" style="font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap">'
    +     '<a href="#/" style="color:#1d70b8;font-weight:600">Worklist</a>'
    +     '<span aria-hidden="true" style="color:#687074">›</span><span class="t-muted">' + esc(a.title) + '</span>'
    +   '</nav>'
    +   '<div style="background:#fff;border:1px solid #e1dfdc;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:18px 22px;margin-bottom:18px">'
    +     '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap">'
    +       '<span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;padding:3px 9px;border-radius:4px;background:' + a.statusTint + ';color:' + a.statusInk + '">' + esc(a.statusLabel) + '</span>'
    +     '</div>'
    +     '<h1 class="t-h3" style="margin:0 0 6px;font-size:26px">' + esc(a.title) + '</h1>'
    +     '<p class="t-body" style="margin:0 0 10px;font-size:17px;color:#0b0c0c">' + esc(a.bannerLine) + '</p>'
    // When the whole thing commences on one date there is no table worth
    // drawing, so the date moves up here — the one fact the section carried,
    // beside the other dates it belongs with.
    +     (a.wholeCommencementLine
        ? '<p class="t-body-sm" style="margin:0 0 8px;color:#0b0c0c">'
          + '<strong style="color:' + a.wholeCommencementLine.color + '">'
          + esc(a.wholeCommencementLine.dateFull) + '</strong> — '
          + esc(a.wholeCommencementLine.what) + ' comes into force'
          + '</p>'
        : '')
    +     '<div class="t-caption t-secondary" style="display:flex;gap:14px;flex-wrap:wrap">'
    +       '<span>' + esc(a.leadLine) + '</span>'
    +       '<a href="' + esc(a.url) + '" target="_blank" rel="noopener" style="color:#1d70b8">View on legislation.gov.uk →</a>'
    +     '</div>'
    // Regulations do not stand alone: they exercise a power in an Act, and that
    // Act is the body of law a designer already knows. Naming it gives an
    // otherwise unfamiliar instrument somewhere to sit.
    +     (a.enablingActs && a.enablingActs.length
        ? '<div class="t-caption t-secondary" style="margin-top:6px">Made under '
          + a.enablingActs.map(x => '<a href="' + esc(x.url) + '" target="_blank" rel="noopener" style="color:#1d70b8">'
              + esc(x.title || x.url.replace("https://www.legislation.gov.uk/", "")) + '</a>').join(", ")
          + '</div>'
        : '')
    +   '</div>'
    +   (a.wholeCommencementLine ? ''
        : '<div style="margin-bottom:8px" class="t-overline">What comes into force, and when</div>'
          + '<div style="margin-bottom:24px;display:flex;flex-direction:column;gap:14px">' + commHTML + '</div>')
    +   futureHTML
    +   actProposalsHTML(a)
    +   '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap">'
    +     '<h2 class="t-h4" style="margin:0;font-size:21px">Affected GOV.UK content</h2>'
    +     '<div style="display:flex;align-items:center;gap:10px">'
    +       (teamOpts.length > 2 ? '<label style="font-size:13px;color:#505a5f;display:flex;align-items:center;gap:6px">Team <select data-ctl="team" style="font-size:13px;font-family:var(--font-stack);padding:7px 9px;border:1px solid #b1b4b6;border-radius:4px;background:#fff;color:#0b0c0c">' + optionsHTML(teamOpts, activeTeam) + '</select></label>' : '')
    +       '<span class="t-caption t-muted">' + esc(activeTeam === "all" ? a.pageCountLabel : (filteredTotal + ' page' + (filteredTotal === 1 ? '' : 's') + ' · ' + activeTeam)) + '</span>'
    +     '</div>'
    +   '</div>'
    +   (a.uniformMatchLabel
        ? '<p class="t-caption t-muted" style="margin:-2px 0 10px">'
          + esc(a.uniformMatchLabel === "Whole-instrument match"
              ? "Matched against the whole instrument — it names no individual regulations to match against."
              : a.uniformMatchLabel === "Act-level match"
              ? "Matched against the Act as a whole — the commencing provisions could not be pinned down."
              : "Every page below was matched the same way: " + a.uniformMatchLabel.toLowerCase() + ".")
          + '</p>'
        : '')
    +   groupsHTML
    + '</main>';
  }

  // "What changes" — the Act's concrete value changes (queue.json `proposals`,
  // present only on a --value-diff build). One card per fact: the thing that
  // changes in plain words, old → new, when, and the pages that still state the
  // superseded value. The drafted callout markdown is behind a "copy suggested
  // wording" button — a convenience, not the headline (T-076). Nothing here
  // publishes; every value traces to the legislation.
  function actProposalsHTML(a) {
    if (!a.proposals || !a.proposals.length) return "";
    const cards = a.proposals.map(pr => {
      const name = pr.entity ? pr.entity.charAt(0).toUpperCase() + pr.entity.slice(1) : "Value change";
      const valueLine = pr.oldVal
        ? '<span style="color:#687074">' + esc(pr.oldVal) + '</span> <span style="color:#687074">→</span> <strong>' + esc(pr.newVal) + '</strong>'
        : 'now <strong>' + esc(pr.newVal) + '</strong>';
      const rows = pr.targets.map(t =>
        '<div style="display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid #f3f1ef">'
        + '<span title="' + esc(t.statusLabel) + '" style="flex:none;width:8px;height:8px;border-radius:50%;background:' + t.ink + ';margin-top:5px"></span>'
        + '<div style="flex:1;min-width:0">'
        +   (t.url ? '<a href="' + esc(t.url) + '" target="_blank" rel="noopener" style="color:#1d70b8;font-size:14px;font-weight:600;text-decoration:none">' + esc(t.title) + '</a>' : '<span style="font-size:14px">' + esc(t.title) + '</span>')
        +   (t.statusLabel ? ' <span class="t-caption t-muted" style="line-height:1.4">— ' + esc(t.statusLabel) + '</span>' : '')
        + '</div>'
        + '<span class="t-caption t-muted" style="flex:none;white-space:nowrap">' + esc(t.owner || "—") + '</span>'
        + '</div>').join("");
      return ''
      + '<div style="background:#fff;border:1px solid #e1dfdc;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:14px 18px;margin-bottom:12px">'
      +   '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">'
      +     '<span style="font-family:var(--font-heading);font-weight:650;font-size:17px;color:#0b0c0c;line-height:1.3">' + esc(name) + '</span>'
      +     (pr.inForce ? '<span class="t-caption t-muted">from ' + esc(pr.inForce) + '</span>' : '')
      +   '</div>'
      +   '<div style="font-size:19px;margin-top:3px;line-height:1.3">' + valueLine + '</div>'
      +   ((pr.provision || pr.legisTitle) ? '<div class="t-caption t-muted" style="margin-top:3px">Source: ' + esc([pr.legisTitle, pr.provision].filter(Boolean).join(" · ")) + '</div>' : '')
      +   (pr.callout ? '<div style="margin-top:9px"><button data-copy="' + esc(pr.callout) + '" style="font-family:var(--font-stack);font-size:12px;font-weight:600;color:#1d70b8;background:#fff;border:1px solid #b1b4b6;border-radius:4px;padding:5px 10px;cursor:pointer">Copy suggested wording</button></div>' : '')
      +   (rows ? '<div style="margin-top:9px">' + rows + '</div>' : '')
      + '</div>';
    }).join("");
    return ''
    + '<div style="margin:6px 0 8px" class="t-overline">What changes</div>'
    + '<p class="t-body-sm t-secondary" style="max-width:720px;margin:0 0 12px">Values that may need updating on matched pages. Confirm the page before editing.</p>'
    + cards;
  }

  function actPageCardHTML(p, actIdx, uniformMatchLabel) {
    return ''
    + '<div class="ew-page-card" style="background:#fff;border:1px solid #e1dfdc;border-top:none;padding:13px 16px;display:flex;gap:14px;align-items:flex-start">'
    +   '<span title="' + esc(p.confLabel) + '" style="width:9px;height:9px;border-radius:50%;background:' + p.confColor + ';flex:none;margin-top:6px"></span>'
    +   '<div style="flex:1;min-width:0">'
    +     '<a href="' + esc(p.url) + '" target="_blank" rel="noopener" style="font-family:var(--font-heading);font-weight:600;font-size:16px;color:#1d70b8;text-decoration:none;line-height:1.25">' + esc(p.title) + '</a>'
    +     (p.description ? '<div class="t-caption t-secondary" style="margin-top:2px;line-height:1.35">' + esc(p.description) + '</div>' : '')
    +     '<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">'
    +       (p.workBadge ? '<span title="' + esc(p.workOwner ? "Owner: " + p.workOwner : "Progress reported by the team") + '" style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em;background:' + p.workBadge.tint + ';color:' + p.workBadge.ink + '">' + esc(p.workBadge.label) + '</span>' : '')
    +       '<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em;background:' + p.estateTint + ';color:' + p.estateColor + '">' + esc(p.estateLabel) + '</span>'
    +       (p.docType ? '<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;background:#f3f2f1;color:#505a5f">' + esc(p.docType) + '</span>' : '')
    +       (p.showPublisher ? '<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;background:#f3f2f1;color:#505a5f"><span style="font-weight:400;color:#687074">Published by · </span>' + esc(p.publisher) + '</span>' : '')
    +       (p.isLongTerm ? '<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;background:#f3f2f1;color:#4c5560">Longer-term measure</span>' : '')
    +       '<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;background:' + p.ownerTint + ';color:' + p.ownerColor + '"><span style="font-weight:400;opacity:.7">Team · </span>' + esc(p.ownerShort) + '</span>'
    +     '</div>'
    // Value-diff finding rendered as a flag, NOT a chip (ISS-031): a red flag is not
    // a category. Own line, flag glyph + sentence-case warning text, matching the
    // readable-finding style ISS-030 gave the proposal rows. (Comment lines here must
    // not start with '+', or the leading '+' becomes a unary plus on the next operand.)
    +     (p.valueBadge ? '<div style="margin-top:6px;display:flex;gap:6px;align-items:baseline" title="Value diff — a red flag to confirm, not a verdict">'
    +       '<span aria-hidden="true" style="flex:none;color:' + p.valueBadge.ink + ';font-size:12px;line-height:1.35">⚑</span>'
    +       '<span style="font-size:12px;line-height:1.35;color:' + p.valueBadge.ink + '"><span style="font-weight:600">' + esc(p.valueBadge.label) + '</span><span style="color:#687074;font-weight:400"> · flag to confirm, not a verdict</span></span>'
    +     '</div>' : '')
    +     (uniformMatchLabel && !p.isLongTerm ? ''
        : '<div style="margin-top:6px"><span style="display:inline-block;font-size:11px;font-family:var(--font-mono,monospace);font-weight:700;padding:2px 8px;border-radius:4px;background:' + p.matchTint + ';color:' + p.matchInk + '">' + esc(p.matchLabel) + '</span></div>')
    +   '</div>'
    +   '<button class="ew-btn-green ew-page-cta" data-open-page="' + actIdx + ':' + p.pi + '" style="flex:none;font-family:var(--font-stack);font-size:13px;font-weight:600;border-radius:4px;padding:8px 13px;cursor:pointer">' + esc(p.cta) + ' →</button>'
    + '</div>';
  }

  // A value-diff note on the page-detail view (value_diff.py output). Frames the
  // diff as a red flag to confirm, never a verdict; the law value and the page's
  // asserted value both trace to a source span. Renders nothing when there is no
  // attached diff (or only a signal-free status).
  function valueDiffNoteHTML(vd) {
    if (!vd || !vd.status) return "";
    let border, head, body;
    if (vd.status === "contradicts") {
      border = "#d4351c"; head = "Check this value first";
      body = "This page appears to say " + esc(vd.page_value || "one thing")
        + "; " + (vd.in_force_date ? "from " + esc(vd.in_force_date) + " " : "") + "the law says " + esc(vd.law_value || "something different") + "."
        + (vd.matched_old_value ? " That is exactly the value being replaced, so it very likely needs updating — confirm on the page." : " Read the page before deciding — this is a flag, not a verdict.");
    } else if (vd.status === "stale_date") {
      border = "#f47738"; head = "Cites an older date";
      body = "The page cites " + esc(vd.page_date || "an earlier date") + ", which this change"
        + (vd.in_force_date ? " (" + esc(vd.in_force_date) + ")" : "") + " supersedes. Check it still reads true.";
    } else if (vd.status === "consistent") {
      border = "#00703c"; head = "Already states the new value";
      body = "This page already says " + esc(vd.law_value || "the new value") + " — probably no change needed, but worth a glance.";
    } else {
      return "";
    }
    return '<div style="margin-top:10px;background:#fff;border:1px solid ' + border + ';padding:10px 14px;font-size:14px;color:#0b0c0c">'
      + '<span style="font-weight:700;color:' + border + '">' + esc(head) + '</span> — ' + body + '</div>';
  }

  // Per-page hand-off brief (T-072), split by provenance (T-098).
  //
  // Two kinds of line used to render identically here, which overstated how much
  // the tool actually knows about *this* page:
  //
  //   found   — observed evidence about this page: the provisions it matched, a
  //             value on the page that the change contradicts.
  //   general — a template keyed off a metadata field (doc type, estate). True
  //             of every page of that type; says nothing about this one.
  //
  // They are now separate lists with separate headings, and a page with no
  // observed evidence says so instead of padding the gap with boilerplate.
  function handoffPanelHTML(p) {
    const stakeholders = [];
    if (p.ownerFull) stakeholders.push({ name: p.ownerFull, role: "likely content owner" });
    if (p.publisherFull && p.publisherFull !== p.ownerFull)
      stakeholders.push({ name: p.publisherFull, role: "publishing organisation" });

    const found = [];
    for (const prov of (p.provisions || []).slice(0, 4)) {
      found.push("Check the page against " + (prov.ref || "the commencing change")
        + (prov.subject ? " (" + prov.subject + ")" : "") + ".");
    }
    if ((p.provisions || []).length > 4) found.push("(+" + (p.provisions.length - 4) + " more matched provisions.)");
    const vd = p.valueDiff || {};
    if (vd.status === "contradicts" || vd.status === "stale_date") {
      found.push("The page appears to state '" + (vd.page_value || "a superseded value")
        + "' where the law now says '" + (vd.law_value || "a new value")
        + "' — verify on the live page (a red flag to investigate, not a verdict).");
    }

    const general = [];
    if (p.rawDocType === "guide") general.push("Multi-part guide: check every chapter, not just the landing page.");
    else if (p.tier === "service") general.push("Transactional page: check computed results against the new values, not just body copy.");
    else if (p.tier === "collection") general.push("Collection page: check the linked set is current — add/remove links rather than editing copy.");
    else if (p.tier === "publication") general.push("Publication: consider an inline note or withdraw-and-replace rather than an edit.");
    if (p.estate === "mainstream") general.push("Mainstream page: edits route through the GDS content team, with policy input from " + (p.publisherFull || "the policy department") + ".");
    if (!stakeholders.length && !found.length && !general.length) return "";

    const list = items => items.map(c =>
      '<div class="t-body-sm" style="padding:3px 0;line-height:1.4">· ' + esc(c) + '</div>').join("");
    const heading = text =>
      '<div class="t-caption" style="font-weight:700;margin:10px 0 4px">' + text + '</div>';

    return ''
    + '<h2 class="t-h4" style="margin:0 0 12px;font-size:19px">Who to involve</h2>'
    + '<div style="background:#fff;border:1px solid #e1dfdc;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:16px 20px;margin-bottom:24px">'
    +   '<p class="t-caption t-muted" style="margin:0 0 10px">Who to involve and what to check when this page comes up for review. Stakeholders are candidates to confirm, not authority.</p>'
    +   (stakeholders.length
          ? '<div class="t-caption" style="font-weight:700;margin-bottom:4px">People and teams to confirm</div>'
            + stakeholders.map(s => '<div class="t-body-sm" style="padding:3px 0">' + esc(s.name) + ' <span class="t-caption t-muted">— ' + esc(s.role) + '</span></div>').join("")
          : '')
    +   (found.length
          ? heading("What was found on this page") + list(found)
          : heading("What was found on this page")
            + '<div class="t-body-sm t-muted" style="padding:3px 0;line-height:1.4">'
            + 'Nothing specific to this page. It matched the change as a whole, not a '
            + 'named provision, and no value on it was checked against the new law. '
            + 'Read the change and judge whether this page is affected.</div>')
    +   (general.length
          ? heading("General for this kind of page")
            + '<div class="t-caption t-muted" style="margin:-2px 0 4px">Applies to every ' + esc(p.docType || "page") + ', not just this one.</div>'
            + list(general)
          : '')
    + '</div>';
  }

  function pageHTML(vm) {
    const p = vm.page;
    const stepsHTML = p.steps.map(st =>
      '<div style="display:flex;gap:14px;padding:14px 0;border-top:1px solid #ebe9e6;align-items:flex-start">'
      + '<div style="flex:none;width:26px;height:26px;border-radius:50%;border:2px solid ' + st.dotColor + ';color:' + st.dotColor + ';display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-family:var(--font-heading)">' + esc(st.num) + '</div>'
      + '<div style="flex:1;min-width:0"><div class="t-body" style="font-size:16px;color:#0b0c0c;line-height:1.35">' + esc(st.label) + '</div></div>'
      + '<div style="flex:none;text-align:right;min-width:120px">'
      +   '<span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:4px;white-space:nowrap;background:' + st.tint + ';color:' + st.ink + '">' + esc(st.flag) + '</span>'
      +   '<div class="t-caption t-muted" style="margin-top:3px">by ' + esc(st.dateLabel) + '</div>'
      + '</div>'
      + '</div>').join("");

    return ''
    + '<main class="ew-main" style="max-width:920px;margin:0 auto;padding:22px 24px 0">'
    +   '<nav aria-label="Breadcrumb" style="font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap">'
    +     '<a href="#/" style="color:#1d70b8;font-weight:600">Worklist</a>'
    +     '<span aria-hidden="true" style="color:#687074">›</span>'
    +     '<a href="' + esc(p.actHref) + '" style="color:#1d70b8;font-weight:600">' + esc(p.actTitle) + '</a>'
    +     '<span aria-hidden="true" style="color:#687074">›</span><span class="t-muted">' + esc(p.title) + '</span>'
    +   '</nav>'
    +   '<div style="background:#fff;border:1px solid #e1dfdc;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px 22px;margin-bottom:18px">'
    +     '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px">'
    +       '<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em;background:' + p.estateTint + ';color:' + p.estateColor + '">' + esc(p.estateLabel) + '</span>'
    +       (p.docType ? '<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;background:#f3f2f1;color:#505a5f">' + esc(p.docType) + '</span>' : '')
    +     '</div>'
    +     '<h1 class="t-h3" style="margin:0 0 6px;font-size:25px;line-height:1.2">' + esc(p.title) + '</h1>'
    +     (p.description ? '<p class="t-body-sm t-secondary" style="margin:0 0 8px;line-height:1.4">' + esc(p.description) + '</p>' : '')
    +     '<a href="' + esc(p.url) + '" target="_blank" rel="noopener" style="font-size:13px;color:#1d70b8;word-break:break-all">' + esc(p.url) + '</a>'
    +     '<div style="margin-top:14px;background:#f4f8fb;border:1px solid #d6e4f0;padding:10px 14px;font-size:14px;color:#0b0c0c">'
    +       '<span style="font-weight:700">Why you\'re seeing this</span> — ' + esc(p.whyLine)
    +     '</div>'
    +     valueDiffNoteHTML(p.valueDiff)
    +   '</div>'
    +   '<div style="background:#fff;border:1px solid #e1dfdc;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:18px 22px;margin-bottom:20px">'
    +     '<div class="t-overline" style="color:' + p.statusInk + ';margin-bottom:5px">Do next</div>'
    +     '<div class="t-h4" style="margin:0 0 5px;font-size:20px">' + esc(p.doNextHead) + '</div>'
    +     '<p class="t-body-sm" style="margin:0;color:#0b0c0c">' + esc(p.doNextSub) + '</p>'
    +     '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:13px">'
    +       '<a class="ew-btn-green" href="' + esc(p.url) + '" target="_blank" rel="noopener" style="font-family:var(--font-stack);font-size:14px;font-weight:600;border-radius:4px;padding:9px 15px;text-decoration:none">Open the page →</a>'
    +       '<a href="' + esc(p.actUrl) + '" target="_blank" rel="noopener" style="font-family:var(--font-stack);font-size:14px;font-weight:600;color:#1d70b8;background:#fff;border:1px solid #b1b4b6;border-radius:4px;padding:9px 15px;text-decoration:none">Read ' + esc(p.actKind === "Act" ? "the Act" : "the regulations") + '</a>'
    +     '</div>'
    +     '<div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid #ebe9e6">'
    +       '<div><div class="t-caption t-muted">Start by</div><div style="font-weight:650;font-family:var(--font-heading)">' + esc(p.startByFull) + '</div></div>'
    +       '<div><div class="t-caption t-muted">In force</div><div style="font-weight:650;font-family:var(--font-heading)">' + esc(p.commenceFull) + '</div></div>'
    +       '<div><div class="t-caption t-muted">Work type</div><div style="font-weight:650;font-family:var(--font-heading)">' + esc(p.workType) + '</div></div>'
    +       '<div><div class="t-caption t-muted">Team</div><div style="font-weight:650;font-family:var(--font-heading)">' + esc(p.ownerShort) + '</div></div>'
    +     '</div>'
    +   '</div>'
    +   '<h2 class="t-h4" style="margin:0 0 12px;font-size:19px">What to do, in order</h2>'
    +   '<div style="background:#fff;border:1px solid #e1dfdc;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:4px 20px 8px;margin-bottom:24px">' + stepsHTML + '</div>'
    +   handoffPanelHTML(p)
    +   '<div style="display:flex;gap:12px;flex-wrap:wrap">'
    +     '<button data-nav="act" style="font-family:var(--font-stack);font-size:14px;font-weight:600;color:#0b0c0c;background:#fff;border:1px solid #b1b4b6;border-radius:4px;padding:10px 16px;cursor:pointer">← Back to affected content</button>'
    +   '</div>'
    + '</main>';
  }

  // ============================== render + nav ==============================
  // The board is cross-government and the reader is one team among ~95, so a
  // single feed serves none of them well — and the deployed one was silently
  // scoped to one department. Static hosting has no query string, so each team
  // gets its own file and the Team filter, where a reader has already said who
  // they are, points at it. Fail-open: no index (older mirror, failed fetch)
  // simply leaves the whole-board feed in place.
  let FEEDS = {};
  function feedForTeam(owner) {
    const rec = FEEDS[owner];
    return rec
      ? { href: rec.file, label: "Subscribe to " + owner + " updates" }
      : { href: "feed.atom", label: "Subscribe to updates" };
  }

  function footerHTML() {
    const f = feedForTeam(state.owner);
    return '<footer style="max-width:1120px;margin:44px auto 0;padding:20px 24px;border-top:1px solid #d0d3d5;color:#687074;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
      +   '<a href="wire-desk.html" style="color:#1d70b8;font-weight:600;text-decoration:none">Open the wire desk</a>'
      +   '<span aria-hidden="true">·</span>'
      +   '<span aria-hidden="true" style="display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;background:#ee802f;color:#fff;border-radius:3px;font-size:9px;font-weight:800;letter-spacing:.02em">RSS</span>'
      +   '<a id="ew-feed" href="' + esc(f.href) + '" style="color:#1d70b8;font-weight:600;text-decoration:none">' + esc(f.label) + '</a>'
      +   '<span>— follow new and changed items in any feed reader.'
      +     (FEEDS[state.owner] ? '' : ' Choose your team above for a feed of just your work.') + '</span>'
      +   '</footer>';
  }

  function fullRender() {
    const vm = computeVM();
    let body;
    if (vm.loading) body = '<div style="max-width:1120px;margin:0 auto;padding:60px 24px;color:#687074">Loading the queue…</div>';
    else if (vm.isOverview) body = overviewHTML(vm);
    else if (vm.isAct) body = actHTML(vm);
    else if (vm.isPage) body = pageHTML(vm);
    else body = overviewHTML(computeVM());   // fall back to overview if a detail view lost its target
    root.innerHTML = '<div style="min-height:100vh;background:#f3f2f1;font-family:var(--font-stack);color:#0b0c0c;padding-bottom:60px">' + headerHTML(vm) + body + footerHTML() + '</div>';
  }

  // Filter changes only swap the overview rows + count — never the controls,
  // so the search box keeps focus and caret while typing.
  function rowsRender() {
    const vm = computeVM();
    if (!vm.isOverview) return;
    const rowsEl = document.getElementById("ew-rows");
    if (rowsEl) rowsEl.innerHTML = overviewRowsHTML(vm.overview);
    const countEl = document.getElementById("ew-count");
    if (countEl) countEl.textContent = vm.overview.count;
    // The Team options are built from every Act in the window, not from the
    // filtered rows, so they never change and need no refresh. The code that
    // used to rebuild them here read `overview.ownerOptions`, which the view
    // model does not have — so this threw a TypeError on every keystroke and
    // every filter change, silently, after the rows had already repainted.
    //
    // The two controls that DO have to be kept in step are the Show select and
    // the headline figures, because both set the same filter.
    const prioEl = document.querySelector('[data-ctl="prio"]');
    if (prioEl && prioEl.value !== state.prio) prioEl.value = state.prio;
    for (const b of document.querySelectorAll(".ew-stat")) {
      b.setAttribute("aria-pressed", b.dataset.stat === state.prio ? "true" : "false");
    }
    // The footer is not re-rendered when only the rows swap, so the feed link
    // has to be kept in step with the Team filter explicitly.
    const feedEl = document.getElementById("ew-feed");
    if (feedEl) {
      const f = feedForTeam(state.owner);
      feedEl.setAttribute("href", f.href);
      feedEl.textContent = f.label;
    }
  }

  // ============================== hash routing ==============================
  // Each view gets a real, shareable URL so deep links, bookmarks, open-in-new-
  // tab and the browser back/forward buttons all work. We use *hash* routes
  // (never path routes) because GitHub Pages serves static files only: the path
  // is always index.html, so #/act/… can't 404 and needs no SPA fallback.
  //   #/                       overview / worklist (filterable Act list)
  //   #/plan                   the whole window on one timeline (Gantt)
  //   #/act/<slug>             one Act's affected content
  //   #/act/<slug>/page/<pi>   a single page's detail
  // <slug> derives from the Act's legislation.gov.uk URL so a shared link
  // survives the nightly rebuild (which can reorder Q.items); <pi> is the page's
  // index within that Act. An unknown slug/pi falls back to the nearest valid
  // view rather than erroring.
  const actSlug = it => {
    const s = String((it && it.legislation_url) || "")
      .replace(/^https?:\/\/(www\.)?legislation\.gov\.uk\//i, "")
      .replace(/[#?].*$/, "").replace(/\/+$/, "")
      .replace(/[^a-z0-9]+/gi, "-").replace(/^-+|-+$/g, "").toLowerCase();
    return s || "act";
  };
  function actIdxForSlug(slug) {
    const items = (Q && Q.items) || [];
    for (let i = 0; i < items.length; i++) if (actSlug(items[i]) === slug) return i;
    return null;
  }
  function stateToHash(s) {
    const items = (Q && Q.items) || [];
    if ((s.view === "act" || s.view === "page") && s.actIdx != null && items[s.actIdx]) {
      const base = "#/act/" + actSlug(items[s.actIdx]);
      if (s.view === "page" && s.pageIdx != null) return base + "/page/" + s.pageIdx;
      return base;
    }
    return "#/";
  }
  function hashToState() {
    const items = (Q && Q.items) || [];
    const seg = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    // #/plan was a separate timeline view until T-098 found it was the worklist's
    // own rows, on the worklist's own axis, minus the counts column — a sort order
    // wearing a tab. Old links still work: they land on the worklist configured
    // the way the plan presented it (everything, chronological).
    if (seg[0] === "plan") {
      state.prio = "all";
      return { view:"overview", actIdx:null, pageIdx:null };
    }
    // #/escalation was a separate page until T-098 found it was the worklist's
    // own overdue/in-force rows transposed by team. It is a saved view now: the
    // worklist narrowed to the work that is behind — which is also the top band.
    if (seg[0] === "escalation") {
      state.prio = "escalate";
      return { view:"overview", actIdx:null, pageIdx:null };
    }
    if (seg[0] === "act" && seg[1] != null) {
      const ai = actIdxForSlug(decodeURIComponent(seg[1]));
      if (ai == null) return { view:"overview", actIdx:null, pageIdx:null };
      if (seg[2] === "page" && seg[3] != null) {
        const pi = Number(seg[3]);
        const pages = (items[ai].affected_pages || []);
        if (Number.isInteger(pi) && pi >= 0 && pi < pages.length)
          return { view:"page", actIdx:ai, pageIdx:pi };
        return { view:"act", actIdx:ai, pageIdx:null };   // stale page ref -> its Act
      }
      return { view:"act", actIdx:ai, pageIdx:null };
    }
    return { view:"overview", actIdx:null, pageIdx:null };
  }

  function setDocTitle() {
    const items = (Q && Q.items) || [];
    let t = "EventWire — legislative change board";
    const it = state.actIdx != null ? items[state.actIdx] : null;
    if (state.view === "act" && it) t = it.legislation_title + " — EventWire";
    else if (state.view === "page" && it) {
      const p = (it.affected_pages || [])[state.pageIdx];
      t = ((p && p.title) || "Affected page") + " — EventWire";
    }
    document.title = t;
  }

  function withTransition(fn) {
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (document.startViewTransition && !reduce) {
      try {
        const vt = document.startViewTransition(fn);
        if (vt && vt.ready) vt.ready.catch(() => {});
        if (vt && vt.finished) vt.finished.catch(() => {});
      } catch (_) { fn(); }
    } else { fn(); }
  }

  // The single place that turns the URL into a rendered view. Folds only the
  // routed keys (view/actIdx/pageIdx) onto state so the overview filter state
  // (q/owner/prio/conf/sort) survives a round-trip into an Act and back.
  function applyRoute() {
    const route = hashToState();
    withTransition(() => {
      state.view = route.view;
      state.actIdx = route.actIdx != null ? route.actIdx : null;
      state.pageIdx = route.pageIdx != null ? route.pageIdx : null;
      window.scrollTo(0, 0);
      fullRender();
      setDocTitle();
    });
  }

  // Navigation is expressed as a route change: click handlers still call
  // navTo({view,…}); we translate that to a hash and let hashchange -> applyRoute
  // do the render, so history is populated automatically.
  function navTo(patch) {
    const hash = stateToHash(Object.assign({}, state, patch));
    if (hash === (location.hash || "#/")) { applyRoute(); return; }  // same view: re-render in place
    location.hash = hash;   // fires "hashchange" -> applyRoute()
  }

  // ---- delegated events (root persists across innerHTML swaps) ----
  root.addEventListener("click", e => {
    const copyEl = e.target.closest("[data-copy]");
    if (copyEl) {
      const txt = copyEl.getAttribute("data-copy") || "";
      const done = () => {
        copyEl.textContent = "Copied ✓";
        setTimeout(() => { copyEl.textContent = "Copy suggested wording"; }, 1600);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => {});
      return;
    }
    // Act rows, view tabs and breadcrumbs are real <a href="#/…"> now, so the
    // platform routes them (T-099). Only the native controls that carry no
    // href — the page CTA button and the "back" button — are handled here.
    const pageEl = e.target.closest("[data-open-page]");
    if (pageEl) { const [ai, pi] = pageEl.dataset.openPage.split(":").map(Number); navTo({ view:"page", actIdx:ai, pageIdx:pi }); return; }
    const navEl = e.target.closest("[data-nav]");
    if (navEl) { navTo({ view:navEl.dataset.nav }); return; }
    // A headline figure is a filter. Clicking the one you are already on clears
    // it, so the same click both narrows and widens and nothing gets stuck.
    const statEl = e.target.closest("[data-stat]");
    if (statEl) {
      state.prio = state.prio === statEl.dataset.stat ? "review" : statEl.dataset.stat;
      rowsRender();
    }
  });
  root.addEventListener("input", e => {
    const el = e.target.closest('[data-ctl="q"]');
    if (el) { state.q = el.value; rowsRender(); }
  });
  root.addEventListener("change", e => {
    const el = e.target.closest("[data-ctl]");
    if (!el) return;
    const key = el.dataset.ctl;
    if (key === "q") return;
    state[key] = el.value;
    if (key === "owner") {
      try { localStorage.setItem(TEAM_KEY, el.value); } catch (_) { /* no memory, no harm */ }
    }
    // Overview filters swap just the rows (keeps search focus); the Act-view team
    // filter (T-103) needs a full re-render of the detail view.
    (state.view === "overview" ? rowsRender : fullRender)();
  });

  // ============================== boot ==============================
  // Cache-bust the data fetch: a per-load query param gives the CDN edge a fresh
  // key (Pages caches queue.json ~10 min) and no-store skips the browser cache,
  // so a returning visitor always sees the latest nightly build. serve.py and
  // Pages both ignore the query string when resolving the static file.
  fetch("feeds/index.json?t=" + Date.now(), { cache: "no-store" })
    .then(r => r.ok ? r.json() : [])
    .then(rows => { for (const r of rows || []) if (r && r.team) FEEDS[r.team] = r; })
    .catch(() => { /* no per-team feeds on this mirror; whole-board link stands */ });

  fetch("queue.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).then(d => {
    Q = d;
    // Tolerate a pre-enrichment queue (older cache): default any missing fields.
    for (const it of (Q.items || [])) {
      it.owners = it.owners || [];
      it.action_count = it.action_count | 0; it.review_count = it.review_count | 0; it.monitor_count = it.monitor_count | 0;
      it.lead_time = it.lead_time || null;
      it.commencements = it.commencements || [];
      it.affected_pages = it.affected_pages || [];
      it.proposals = it.proposals || [];
      for (const p of it.affected_pages) {
        p.priority = p.priority || "action"; p.estate = p.estate || "other";
        p.owner = p.owner || "Unknown owner"; p.publisher_short = p.publisher_short || ""; p.topics = p.topics || [];
      }
    }
    // Make longer-term matches addressable from an Act's page-detail routes as
    // well as visible in the Act model. They remain monitor-only and do not
    // alter the dated counts above.
    const prospectiveByUrl = new Map(((Q.prospective && Q.prospective.items) || [])
      .filter(x => x.legislation_url)
      .map(x => [x.legislation_url, x]));
    for (const it of (Q.items || [])) {
      const x = prospectiveByUrl.get(it.legislation_url);
      if (!x) continue;
      const known = new Set(it.affected_pages.map(p => p.url).filter(Boolean));
      for (const p of (x.affected_pages || [])) {
        if (!p.url || known.has(p.url)) continue;
        const copy = Object.assign({}, p, { priority: "monitor", long_term: true, long_term_provisions: x.provisions_sample || [] });
        copy.estate = copy.estate || "other"; copy.owner = copy.owner || "Unknown owner";
        copy.publisher_short = copy.publisher_short || ""; copy.topics = copy.topics || [];
        it.affected_pages.push(copy); known.add(p.url);
      }
    }
    state.ready = true;
    if (d.error) { root.innerHTML = '<div style="max-width:1120px;margin:0 auto;padding:60px 24px;color:#687074">' + esc(d.error) + '</div>'; return; }
    // Honour a deep link on first paint (no view transition on cold start),
    // then let the URL drive every subsequent navigation.
    Object.assign(state, hashToState());
    fullRender();
    setDocTitle();
    window.addEventListener("hashchange", applyRoute);
  }).catch(e => {
    root.innerHTML = '<div style="max-width:1120px;margin:0 auto;padding:60px 24px;color:#687074">Could not load queue.json: ' + esc(String(e)) + '</div>';
  });
})();
</script>
</body>
</html>
